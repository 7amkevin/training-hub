/* ── Wake Lock：训练期间屏幕别黑 ── */
async function woWakeOn() {
  try {
    if (!navigator.wakeLock) return;
    if (_woWake) return;
    _woWake = await navigator.wakeLock.request('screen');
    _woWake.addEventListener('release', function () { _woWake = null; });
  } catch (e) { /* 不支持就算了 */ }
}
function woWakeOff() {
  try { if (_woWake) { _woWake.release(); _woWake = null; } } catch (e) {}
}

/* ── 开始 / 结束训练 ── */
function startWorkout(dsKey) {
  woKey = dsKey;
  var S = ensureSession(dsKey);
  // 只记开始时间，保持草稿态 —— 按下开始但一组都没录，不该在日历上留痕
  if (!S.startedAt) { S.startedAt = new Date().toISOString(); saveStore(); }
  // 定位到第一个「还有没做完的组」的动作
  woCur = 0;
  for (var i = 0; i < S.entries.length; i++) {
    var done = (S.entries[i].sets || []).filter(function (x) { return x.done; }).length;
    if (done < (S.entries[i].sets || []).length) { woCur = i; break; }
  }
  woWakeOn();
  woAudioUnlock();          // ← 必须在用户点击的这一刻解锁，否则 iOS 计时结束时不会响
  woNotifyAsk();            // ← 通知权限同样必须在这里申请
  renderWorkout(dsKey);
}

function woFinish() {
  var S = store.sessions[woKey]; if (!S) return;
  S.finishedAt = new Date().toISOString();
  // 清掉全空的组
  S.entries.forEach(function (e) {
    e.sets = (e.sets || []).filter(function (x) { return !(x.w == null && x.r == null); });
  });
  var done = S.entries.filter(function (e) { return e.sets.length; }).length;
  S.summary = { done: done + '/' + S.entries.length };
  touchSession(woKey);
  woTimerStop(); woWakeOff();
  var k = woKey; woKey = null;
  renderCalendar();
  showNewLog(k, S.planType);
  // 盖下印章 —— 这是设计稿说的「视觉化的完成感」
  showSealStamp(['训','练','完','成'], 'red', '训练完成');
}

/* ── 计时器控制 ── */
function woTimerStart(seconds, label) {
  woTimer = { endsAt: Date.now() + seconds * 1000, total: seconds, label: label || '' };
  woTimerSave();
  woTimerPaint();
  if (_woTick) clearInterval(_woTick);
  _woTick = setInterval(woTimerPaint, 250);
}
function woTimerStop() {
  woTimer = { endsAt: 0, total: 0, label: '' };
  woTimerSave();
  if (_woTick) { clearInterval(_woTick); _woTick = null; }
  var el = document.getElementById('woTimer');
  if (el) el.remove();
}
function woTimerAdjust(delta) {
  if (!woTimer.endsAt) return;
  woTimer.endsAt += delta * 1000;
  woTimer.total = Math.max(woTimer.total + delta, 1);
  woTimerSave();
  woTimerPaint();
}
function woTimerPaint() {
  var el = document.getElementById('woTimer');
  if (!woTimer.endsAt) { if (el) el.remove(); return; }
  var left = woTimerLeft();
  if (left <= 0) {
    woBeep(2);
    woTimerStop();
    woAlert();
    woNotify('休息结束', '该下一组了');
    return;
  }
  if (!el) {
    el = document.createElement('div');
    el.id = 'woTimer';
    el.className = 'wo-timer';
    document.body.appendChild(el);
  }
  var pct = woTimer.total ? Math.max(0, Math.min(100, (1 - left / woTimer.total) * 100)) : 0;
  el.innerHTML = '<div class="wo-timer-in">'
    + '<div class="wo-timer-k">休息' + (woTimer.label ? ' · ' + esc(woTimer.label) : '') + '</div>'
    + '<div class="wo-timer-v">' + woFmt(left) + '</div>'
    + '<div class="wo-timer-bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
    + '<div class="wo-timer-btns">'
    + '<button onclick="woTimerAdjust(-15)">-15s</button>'
    + '<button onclick="woTimerAdjust(15)">+15s</button>'
    + '<button onclick="woTimerStop()">跳过</button>'
    + '</div></div>';
}

/** 计时结束的视觉兜底 —— iPhone 没有震动，声音又可能被静音，所以必须看得见 */
/* 到点提醒：重复响 + 闪，直到用户点「知道了」
 * 为什么要重复 —— iPhone 没有震动，手机又可能静音，
 * 单次提示很容易被错过；重复 + 必须手动关闭才可靠。 */
var _woAlertTimer = null, _woAlertCount = 0;
var WO_ALERT_MAX = 12;      // 最多重复 12 次（约 48 秒）后自动停

function woAlert() {
  _woAlertCount = 0;
  woAlertPaint();
  if (_woAlertTimer) clearInterval(_woAlertTimer);
  _woAlertTimer = setInterval(function () {
    _woAlertCount++;
    if (_woAlertCount >= WO_ALERT_MAX) { woAlertDismiss(); return; }
    woTimerPing();
  }, 4000);
}

/** 重复提醒的每一次：响一声 + 闪一下 */
function woTimerPing() {
  woPlay(woSoundGet(), 1);
  var el = document.getElementById('woAlert');
  if (el && el.classList) {
    el.classList.remove('ping');
    // 触发重绘让动画重放
    void (el.offsetWidth);
    el.classList.add('ping');
  }
}

function woAlertPaint() {
  var el = document.getElementById('woAlert');
  if (!el && typeof document !== 'undefined' && document.createElement) {
    el = document.createElement('div');
    el.id = 'woAlert';
    el.className = 'wo-alert';
    if (document.body) document.body.appendChild(el);
  }
  if (!el) return;
  el.innerHTML = '<div class="wo-alert-in">✅ 休息结束'
    + '<span>该下一组了</span>'
    + '<button class="wo-alert-ok" onclick="woAlertDismiss()">知道了</button></div>';
}

function woAlertDismiss() {
  if (_woAlertTimer) { clearInterval(_woAlertTimer); _woAlertTimer = null; }
  var el = document.getElementById('woAlert');
  if (el && el.remove) el.remove();
}

/* ── 组的操作 ── */
function woCompleteSet(ei, si) {
  var S = store.sessions[woKey]; if (!S) return;
  var e = S.entries[ei]; if (!e || !e.sets[si]) return;
  woAudioUnlock();          // ← 每次点击都顺手解锁一次（iOS 的上下文可能被回收）
  var st = e.sets[si];
  if (st.w == null || st.r == null) {
    // 没填完就先聚焦到那个输入框，别让人困惑
    var inp = document.getElementById('wo-in-' + ei + '-' + si + '-' + (st.w == null ? 'w' : 'r'));
    if (inp && inp.focus) inp.focus();
    return;
  }
  st.done = true;
  st.doneAt = new Date().toISOString();
  touchSession(woKey);

  // 自动开计时：用本动作的休息时长
  var P = getPlan(S.planType);
  var pEx = P ? P.ex.filter(function (x) { return x.n === e.n; })[0] : null;
  var secs = pEx ? parseRest(pEx.rest) : 90;
  if (st.t !== 'w') woTimerStart(secs, e.name);   // 热身组之间不强制长休息

  // 全部做完就自动跳到下一个动作
  var allDone = e.sets.length > 0 && e.sets.every(function (x) { return x.done; });
  if (allDone && ei + 1 < S.entries.length) {
    setTimeout(function () { woCur = ei + 1; renderWorkout(woKey); }, 350);
  } else {
    renderWorkout(woKey);
  }
}
function woUndoSet(ei, si) {
  var S = store.sessions[woKey]; if (!S) return;
  var e = S.entries[ei]; if (!e || !e.sets[si]) return;
  delete e.sets[si].done; delete e.sets[si].doneAt;
  touchSession(woKey);
  renderWorkout(woKey);
}
function woCycleType(ei, si) {
  var S = store.sessions[woKey]; if (!S) return;
  var e = S.entries[ei]; if (!e || !e.sets[si]) return;
  e.sets[si].t = (e.sets[si].t === 'w') ? 'n' : 'w';
  touchSession(woKey);
  renderWorkout(woKey);
}
function woInput(ei, si, field, val) {
  var S = store.sessions[woKey]; if (!S) return;
  var e = S.entries[ei]; if (!e || !e.sets[si]) return;
  var n = parseFloat(val);
  e.sets[si][field] = (val === '' || !isFinite(n)) ? null : (field === 'r' ? Math.round(n) : n);
  touchSession(woKey);
}
/** 在最前面插入一组热身 —— 比「点组号切换」好发现得多 */
function woAddWarmup(ei) {
  var S = store.sessions[woKey]; if (!S) return;
  var e = S.entries[ei]; if (!e) return;
  var w = null;
  for (var i = 0; i < e.sets.length; i++) {
    if (e.sets[i].t !== 'w' && e.sets[i].w != null) { w = e.sets[i].w; break; }
  }
  var warmW = w ? Math.round(w * 0.6 / 2.5) * 2.5 : null;   // 约 60% 重量，取 2.5 的倍数
  e.sets.unshift({ w: warmW, r: 12, t: 'w' });
  touchSession(woKey);
  renderWorkout(woKey);
}

function woAddSet(ei) {
  var S = store.sessions[woKey]; if (!S) return;
  var e = S.entries[ei]; if (!e) return;
  var prev = null;
  for (var i = e.sets.length - 1; i >= 0; i--) {
    if (e.sets[i].w != null || e.sets[i].r != null) { prev = e.sets[i]; break; }
  }
  e.sets.push({ w: prev ? prev.w : null, r: prev ? prev.r : null, t: prev ? prev.t : 'n' });
  touchSession(woKey);
  renderWorkout(woKey);
}
function woDelSet(ei, si) {
  var S = store.sessions[woKey]; if (!S) return;
  var e = S.entries[ei]; if (!e) return;
  e.sets.splice(si, 1);
  touchSession(woKey);
  renderWorkout(woKey);
}
function woNav(dir) {
  var S = store.sessions[woKey]; if (!S) return;
  var n = woCur + dir;
  if (n < 0 || n >= S.entries.length) return;
  woCur = n;
  renderWorkout(woKey);
}

/* ── 训练时长 ── */
function woElapsed(S) {
  if (!S.startedAt) return 0;
  var end = S.finishedAt ? Date.parse(S.finishedAt) : Date.now();
  return Math.max(0, Math.round((end - Date.parse(S.startedAt)) / 1000));
}

/* ── 渲染 ── */
function renderWorkout(dsKey) {
  var S = store.sessions[dsKey]; if (!S) return;
  var P = getPlan(S.planType);
  var e = S.entries[woCur];
  if (!e) { woFinish(); return; }
  var pEx = P ? P.ex.filter(function (x) { return x.n === e.n; })[0] : null;
  var last = lastSessionFor(e.name, dsKey);

  var totalSets = 0, doneSets = 0;
  S.entries.forEach(function (x) {
    (x.sets || []).forEach(function (y) { totalSets++; if (y.done) doneSets++; });
  });

  var h = '<div class="ov-header"><div><div class="title">▶ 训练中</div>'
    + '<div class="sub">' + dsKey + ' · ' + S.planType + '</div></div>'
    + '<button class="close-btn" onclick="woFinish()">结束</button></div>';

  h += '<div class="wo-bar"><span>用时 <b>' + woFmt(woElapsed(S)) + '</b></span>'
    + '<span>进度 <b>' + doneSets + '/' + totalSets + ' 组</b></span>'
    + '<button class="btn-xs" onclick="woTestTimer()">⏱ 测 5 秒</button>'
    + '<button class="btn-xs" onclick="showSoundPicker()">🔔 提示音</button></div>'
    + '<div class="wo-sndmsg" id="woSoundMsg"></div>';

  h += '<div class="ov-body">';

  // 当前动作卡
  h += '<div class="wo-card">';
  h += '<div class="wo-nav"><button class="btn-xs" onclick="woNav(-1)"' + (woCur === 0 ? ' disabled' : '') + '>←</button>'
    + '<span class="wo-idx">' + (woCur + 1) + ' / ' + S.entries.length + '</span>'
    + '<button class="btn-xs" onclick="woNav(1)"' + (woCur === S.entries.length - 1 ? ' disabled' : '') + '>→</button></div>';
  h += '<div class="wo-title">' + e.name + '</div>';
  h += '<div class="wo-meta">'
    + (last ? '上次 ' + fmtSets(last.sets) + ' · ' : '')
    + (pEx ? pEx.wt + ' · ' + pEx.sr + (pEx.rir && pEx.rir !== '—' ? ' · ' + pEx.rir : '') + ' · 休息 ' + pEx.rest : '')
    + '</div>';
  h += '</div>';

  // 组列表
  h += '<div class="wo-sets">';
  e.sets.forEach(function (st, si) {
    var isNext = !st.done && e.sets.slice(0, si).every(function (x) { return x.done; });
    h += '<div class="wo-set' + (st.done ? ' done' : '') + (isNext ? ' cur' : '') + (st.t === 'w' ? ' warm' : '') + '">';
    h += '<span class="wo-si" onclick="woCycleType(' + woCur + ',' + si + ')" title="点击切换 正式/热身">'
      + (st.t === 'w' ? '热' : (si + 1)) + '</span>';
    h += '<input id="wo-in-' + woCur + '-' + si + '-w" class="rec-in' + (st.t === 'w' ? ' warm' : '') + '" type="number" inputmode="decimal" step="0.5" value="' + inVal(st.w) + '" placeholder="kg" oninput="woInput(' + woCur + ',' + si + ',\'w\',this.value)">';
    h += '<span class="rec-u">kg</span>';
    h += '<input id="wo-in-' + woCur + '-' + si + '-r" class="rec-in rec-in-r' + (st.t === 'w' ? ' warm' : '') + '" type="number" inputmode="numeric" value="' + inVal(st.r) + '" placeholder="次" oninput="woInput(' + woCur + ',' + si + ',\'r\',this.value)">';
    h += '<span class="rec-u">次</span>';
    h += st.done
      ? '<button class="wo-ck on" onclick="woUndoSet(' + woCur + ',' + si + ')">✓</button>'
      : '<button class="wo-ck" onclick="woCompleteSet(' + woCur + ',' + si + ')">完成</button>';
    h += '<button class="rec-del" onclick="woDelSet(' + woCur + ',' + si + ')">✕</button>';
    h += '</div>';
  });
  h += '<div class="wo-addrow">'
    + '<button class="rec-add" onclick="woAddWarmup(' + woCur + ')">+ 热身组</button>'
    + '<button class="rec-add" onclick="woAddSet(' + woCur + ')">+ 正式组</button>'
    + '</div>';
  h += '<div class="wo-hint">点组号可切换 正式/热身 · 热身组不计入总容量</div>';
  h += '</div>';

  // 备注
  h += '<div class="rec-note-wrap"><textarea class="rec-note" rows="2" placeholder="备注（状态、肩有没有响…）" oninput="woNote(this.value)">' + esc(S.note || '') + '</textarea></div>';

  h += '</div>';

  // 底部固定操作条
  h += '<div class="wo-foot">'
    + '<button class="btn-xs" onclick="woNav(-1)"' + (woCur === 0 ? ' disabled' : '') + '>← 上一个</button>'
    + '<button class="btn-rec" style="flex:1" onclick="woFinish()">完成训练</button>'
    + '<button class="btn-xs" onclick="woNav(1)"' + (woCur === S.entries.length - 1 ? ' disabled' : '') + '>下一个 →</button>'
    + '</div>';

  renderMain(h);
  woTimerPaint();   // 若计时器在跑，重新挂上
}

function woNote(val) {
  var S = store.sessions[woKey]; if (!S) return;
  S.note = val; touchSession(woKey);
}

if (typeof document !== 'undefined' && document.addEventListener) {
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && woKey) {
      woWakeOn();
      // 后台被挂起期间错过的到点提醒，回前台立刻补上
      if (woTimer.endsAt && woTimerLeft() <= 0) { woBeep(2); woTimerStop(); woAlert(); woNotify('休息结束', '该下一组了'); }
    }
  });
}

woTimerLoad();
if (_woTick) clearInterval(_woTick);
if (woTimerActive()) _woTick = setInterval(woTimerPaint, 250);

/* ══════════════════════════════════════════════════════════════════
 * 训练中枢 · 身体围度追踪（FR-03）
 * ------------------------------------------------------------------
 * 为什么需要它：
 *   审美目标（肩宽、V-taper、方正胸型）全是**比例**目标，
 *   但之前系统里一条围度数据都没有 —— 无法回答「我有没有在朝目标走」。
 *   训练模式管「练得够不够」，围度管「练得对不对」。
 *
 * 为什么用「肩围」而不是「肩宽」：
 *   肩宽（两肩峰直线距离）要用卡尺或靠墙量，自测误差大；
 *   肩围用软尺绕最宽处一圈即可，且是健美界追踪 V-taper 的标准指标。
 *
 * 数据存储：store.measures['YYYY-MM-DD'] = { weight, chest, ... , updatedAt }
 *          走 kind='measure'，数据库与同步层早已支持，无需改表。
 * ══════════════════════════════════════════════════════════════════ */

var MEA_FIELDS = [
  { g: '基础', k: 'weight',  n: '体重',   u: 'kg' },
  { g: '基础', k: 'bodyfat', n: '体脂率', u: '%',  opt: true },
  { g: '躯干', k: 'neck',    n: '颈围',   u: 'cm' },
  { g: '躯干', k: 'shoulder',n: '肩围',   u: 'cm' },
  { g: '躯干', k: 'chest',   n: '胸围',   u: 'cm' },
  { g: '躯干', k: 'waist',   n: '腰围',   u: 'cm' },
  { g: '躯干', k: 'hip',     n: '臀围',   u: 'cm' },
  { g: '手臂', k: 'armL',    n: '左上臂', u: 'cm' },
  { g: '手臂', k: 'armR',    n: '右上臂', u: 'cm' },
  { g: '手臂', k: 'foreL',   n: '左前臂', u: 'cm' },
  { g: '手臂', k: 'foreR',   n: '右前臂', u: 'cm' },
  { g: '腿',   k: 'thighL',  n: '左大腿', u: 'cm' },
  { g: '腿',   k: 'thighR',  n: '右大腿', u: 'cm' },
  { g: '腿',   k: 'calfL',   n: '左小腿', u: 'cm' },
  { g: '腿',   k: 'calfR',   n: '右小腿', u: 'cm' }
];

var meaCurKey = null;

/* ── 读写 ─────────────────────────────────────────────────────── */

function meaGet(dsKey) { return store.measures[dsKey] || null; }

/** 找 dsKey 之前最近一次的测量（用于「上次」对照与预填） */
function meaLast(beforeKey) {
  var keys = Object.keys(store.measures).filter(function (k) {
    return (!beforeKey || k < beforeKey) && !isDeleted(store.measures[k]);
  }).sort();
  return keys.length ? { date: keys[keys.length - 1], data: store.measures[keys[keys.length - 1]] } : null;
}

function meaTouch(dsKey) {
  var o = store.measures[dsKey]; if (!o) return;
  o.updatedAt = new Date().toISOString();
  markDirty('measure', dsKey);
  saveStore();
  scheduleSync();
}

function meaSet(dsKey, k, v) {
  if (!store.measures[dsKey]) store.measures[dsKey] = { updatedAt: new Date().toISOString() };
  var n = parseFloat(v);
  if (v === '' || !isFinite(n)) delete store.measures[dsKey][k];
  else store.measures[dsKey][k] = Math.round(n * 10) / 10;   // 保留 1 位小数
  meaTouch(dsKey);
  meaPaintRatios();
}

/** 有没有填过任何一项（没填过就不该占用日历上的日期） */
function meaHasData(o) {
  if (!o) return false;
  return MEA_FIELDS.some(function (f) { return o[f.k] != null; });
}

/* ── 派生指标 ─────────────────────────────────────────────────── */

/** 保留 1 位小数 —— 避免 38.2 - 37.8 = 0.4000000000000057 这种浮点噪音 */
function r1(x) { return Math.round(x * 10) / 10; }

function meaRatios(o) {
  if (!o) return {};
  var r = {};
  if (o.shoulder && o.waist) r.shoulderWaist = Math.round(o.shoulder / o.waist * 100) / 100;      // 肩腰比（V-taper 核心）
  if (o.chest && o.waist)    r.chestWaist    = r1(o.chest - o.waist);         // 胸腰差（倒三角来源）
  if (o.waist && o.hip)      r.waistHip      = Math.round(o.waist / o.hip * 100) / 100;           // 腰臀比
  if (o.armL && o.armR)      r.armDiff       = r1(o.armR - o.armL);           // 左右臂差（惯用侧）
  if (o.thighL && o.thighR)  r.thighDiff     = r1(o.thighR - o.thighL);
  if (o.calfL && o.calfR)    r.calfDiff      = r1(o.calfR - o.calfL);
  return r;
}

/* ── 录入界面 ─────────────────────────────────────────────────── */

function showMeasure(dsKey) {
  dsKey = dsKey || ds(new Date());
  meaCurKey = dsKey;
  if (!store.measures[dsKey]) store.measures[dsKey] = { updatedAt: new Date().toISOString() };
  var cur = store.measures[dsKey];
  var last = meaLast(dsKey);
  var lastData = last ? last.data : null;

  var h = '<div class="ov-header"><div><div class="title">📏 身体围度</div>'
    + '<div class="sub">' + dsKey + (last ? ' · 上次 ' + last.date : ' · 首次测量') + '</div></div>'
    + '<button class="close-btn" onclick="closeView()">✕</button></div>';
  h += '<div class="ov-body">';

  var groups = [];
  MEA_FIELDS.forEach(function (f) { if (groups.indexOf(f.g) < 0) groups.push(f.g); });
  groups.forEach(function (g) {
    h += '<div class="mea-group"><div class="mea-gh">' + g + '</div>';
    MEA_FIELDS.filter(function (f) { return f.g === g; }).forEach(function (f) {
      var v = cur[f.k];
      var prev = lastData ? lastData[f.k] : null;
      var delta = (v != null && prev != null) ? (v - prev) : null;
      var dTxt = '';
      if (delta != null && Math.abs(delta) >= 0.05) {
        dTxt = '<span class="mea-d ' + (delta > 0 ? 'up' : 'down') + '">'
             + (delta > 0 ? '+' : '') + delta.toFixed(1) + '</span>';
      }
      h += '<div class="mea-row">'
        + '<span class="mea-n">' + f.n + '</span>'
        + '<input class="mea-in" type="number" inputmode="decimal" step="0.1" value="' + inVal(v) + '"'
        + ' placeholder="' + (prev != null ? prev : '—') + '"'
        + ' oninput="meaSet(\'' + dsKey + '\',\'' + f.k + '\',this.value)" onchange="meaRowRefresh()">'
        + '<span class="mea-u">' + f.u + '</span>'
        + '<span class="mea-prev">' + (prev != null ? '上次 ' + prev : (f.opt ? '可选' : '')) + '</span>'
        + dTxt
        + '</div>';
    });
    h += '</div>';
  });

  h += '<div class="mea-ratios" id="meaRatios">' + meaRatiosHtml(cur) + '</div>';
  h += '<div class="mea-note">测量建议：<b>每两周一次</b>，早上空腹、同一时间、软尺贴皮不压紧。<br>'
    + '围度变化慢，天天量只会看到噪音。</div>';
  h += '<div class="rec-foot">'
    + '<button class="btn-rec" onclick="closeView()">✓ 完成</button>'
    + '<button class="btn-xs" onclick="showMeasureTrend()">📈 看趋势</button>'
    + '<button class="btn-xs btn-danger" onclick="meaDelete(\'' + dsKey + '\')">删除本次</button>'
    + '</div>';
  h += '</div>';
  renderMain(h);
}

function meaRatiosHtml(o) {
  var r = meaRatios(o);
  var rows = [];
  if (r.shoulderWaist != null) {
    var target = 1.50;
    var gap = r.shoulderWaist - target;
    rows.push(['肩腰比', r.shoulderWaist.toFixed(2),
      (gap >= 0 ? '✅ 已达标 ' : '距目标 1.50 还差 ') + Math.abs(gap).toFixed(2)]);
  }
  if (r.chestWaist != null) rows.push(['胸腰差', r.chestWaist.toFixed(1) + ' cm', '倒三角的视觉来源']);
  if (r.waistHip != null) rows.push(['腰臀比', r.waistHip.toFixed(2), '']);
  if (r.armDiff != null && Math.abs(r.armDiff) >= 0.2) rows.push(['左右臂差', (r.armDiff > 0 ? '+' : '') + r.armDiff.toFixed(1) + ' cm', '惯用侧通常更粗，超过 1cm 要留意']);
  if (r.thighDiff != null && Math.abs(r.thighDiff) >= 0.5) rows.push(['左右腿差', (r.thighDiff > 0 ? '+' : '') + r.thighDiff.toFixed(1) + ' cm', '']);
  if (!rows.length) return '<div class="mea-rhint">填了肩围 + 腰围后会自动算出肩腰比</div>';
  return rows.map(function (x) {
    return '<div class="mea-rrow"><span>' + x[0] + '</span><b>' + x[1] + '</b><em>' + x[2] + '</em></div>';
  }).join('');
}

function meaPaintRatios() {
  var el = document.getElementById('meaRatios');
  if (!el || !meaCurKey) return;
  el.innerHTML = meaRatiosHtml(store.measures[meaCurKey]);
}

function meaRowRefresh() { /* onchange 钩子，留给将来做整行重绘 */ }

function meaDelete(dsKey) {
  if (typeof confirm === 'function' && !confirm('删除 ' + dsKey + ' 的围度记录？')) return;
  if (isLoggedIn()) {
    var o = store.measures[dsKey];
    if (o) { o.deletedAt = new Date().toISOString(); o.updatedAt = o.deletedAt; markDirty('measure', dsKey); }
  } else {
    delete store.measures[dsKey];
  }
  saveStore(); renderCalendar(); closeView();
}

/* ── 趋势 ─────────────────────────────────────────────────────── */

function showMeasureTrend() {
  var keys = Object.keys(store.measures)
    .filter(function (k) { return !isDeleted(store.measures[k]) && meaHasData(store.measures[k]); })
    .sort();
  var h = '<div class="ov-header"><div><div class="title">📈 围度趋势</div>'
    + '<div class="sub">共 ' + keys.length + ' 次测量</div></div>'
    + '<button class="close-btn" onclick="showMeasure()">✕</button></div>';
  h += '<div class="ov-body">';
  if (keys.length < 2) {
    h += '<div class="tea-note" style="padding:12px 16px">至少要有 2 次测量才能看出变化。'
      + '<br>建议每两周量一次，坚持一个月就有意义了。</div>';
  } else {
    var show = keys.slice(-6);              // 最近 6 次
    h += '<div class="mea-tw"><table class="mea-tbl"><thead><tr><th>部位</th>';
    show.forEach(function (k) { h += '<th>' + k.slice(5) + '</th>'; });
    h += '<th>变化</th></tr></thead><tbody>';
    MEA_FIELDS.forEach(function (f) {
      var vals = show.map(function (k) { return store.measures[k][f.k]; });
      if (vals.every(function (x) { return x == null; })) return;   // 该项从没填过就跳过
      h += '<tr><td class="mea-tn">' + f.n + '</td>';
      vals.forEach(function (x) { h += '<td>' + (x == null ? '—' : x) + '</td>'; });
      var first = null, lastV = null;
      for (var i = 0; i < vals.length; i++) if (vals[i] != null) { if (first === null) first = vals[i]; lastV = vals[i]; }
      var d = (first != null && lastV != null && vals.filter(function (x) { return x != null; }).length > 1) ? lastV - first : null;
      h += '<td class="mea-td">' + (d == null ? '—'
        : '<span class="' + (d > 0 ? 'up' : d < 0 ? 'down' : '') + '">' + (d > 0 ? '+' : '') + d.toFixed(1) + '</span>') + '</td>';
      h += '</tr>';
    });
    // 派生指标行
    var firstO = store.measures[show[0]], lastO = store.measures[show[show.length - 1]];
    var r1 = meaRatios(firstO), r2 = meaRatios(lastO);
    if (r1.shoulderWaist != null && r2.shoulderWaist != null) {
      var d2 = r2.shoulderWaist - r1.shoulderWaist;
      h += '<tr class="mea-tkey"><td class="mea-tn">肩腰比</td>';
      show.forEach(function (k) {
        var rr = meaRatios(store.measures[k]);
        h += '<td>' + (rr.shoulderWaist != null ? rr.shoulderWaist.toFixed(2) : '—') + '</td>';
      });
      h += '<td class="mea-td"><span class="' + (d2 > 0 ? 'up' : d2 < 0 ? 'down' : '') + '">'
        + (d2 > 0 ? '+' : '') + d2.toFixed(2) + '</span></td></tr>';
    }
    h += '</tbody></table></div>';
    h += '<div class="mea-note">「变化」= 最右列 − 最左列。绿色是增加，红色是减少。<br>'
      + '⚠️ 腰围减少、肩围增加，才是朝审美目标走。</div>';
  }
  h += '<div class="rec-foot"><button class="btn-rec" onclick="showMeasure()">📏 去测量</button></div>';
  h += '</div>';
  renderMain(h);
}

/* ══════════════════════════════════════════════════════════════════
 * 训练中枢 · 训练量趋势（FR-11）
 * ------------------------------------------------------------------
 * 回答一个具体问题：**我到底有没有在进步？**
 *
 * 用什么衡量：总容量 = Σ(重量 × 次数)
 *   这是渐进超负荷最直接的量化指标 —— 重量涨了、次数涨了、组数涨了，
 *   都会体现在这一个数字上。
 *
 * 三个计算约定：
 *   1. 热身组（t='w'）不计入 —— 否则「总容量」会被热身污染，
 *      看着在涨但其实只是热身做多了
 *   2. 历史汇总格式（'80kg' / '8·7·8'）会被解析后一并计入 ——
 *      否则迁移过来的旧数据在趋势里是空白
 *   3. 判定「进步/退步」的阈值是 ±2% —— 低于这个幅度是测量噪音不是趋势
 * ══════════════════════════════════════════════════════════════════ */

/** 单个动作在某次训练里的容量 */
function entryVolume(e) {
  var vol = 0, sets = 0, ws = [];
  if (!e) return { vol: 0, sets: 0, topW: null };
  if (e.sets && e.sets.length) {
    e.sets.forEach(function (x) {
      if (x.t === 'w') return;                       // 热身不计
      if (x.w != null && x.r != null) { vol += x.w * x.r; sets++; ws.push(x.w); }
    });
  } else if (e.legacy || e.rawW) {
    var p = parseLegacySet({ wt: e.rawW || '', rep: e.rawR || '' });
    p.reps.forEach(function (r) { if (r > 0) { vol += p.w * r; sets++; } });
    if (p.w > 0) ws.push(p.w);
  }
  return { vol: Math.round(vol), sets: sets, topW: ws.length ? Math.max.apply(null, ws) : null };
}

/** 整次训练的容量 */
function sessionVolume(S) {
  if (!S) return { vol: 0, sets: 0 };
  var vol = 0, sets = 0;
  sessionEntries(S).forEach(function (e) {
    var v = entryVolume(e);
    vol += v.vol; sets += v.sets;
  });
  return { vol: vol, sets: sets };
}

/** 某动作的全部历史（按日期升序） */
function exerciseHistory(name) {
  var all = allSessions();
  var out = [];
  Object.keys(all).sort().forEach(function (d) {
    var S = all[d];
    if (!S) return;
    var ents = sessionEntries(S);
    for (var i = 0; i < ents.length; i++) {
      if (ents[i].name !== name) continue;
      var v = entryVolume(ents[i]);
      if (v.vol > 0) out.push({ date: d, vol: v.vol, sets: v.sets, topW: v.topW, planType: S.planType });
      break;
    }
  });
  return out;
}

/** 某日期所在周的周一（用于按周聚合） */
function weekStart(dsKey) {
  var d = new Date(dsKey + 'T12:00:00');
  var dow = d.getDay();                 // 0=周日
  var back = (dow === 0 ? 6 : dow - 1); // 回退到周一
  d.setDate(d.getDate() - back);
  return ds(d);
}

/** 按周聚合的总容量 */
function weeklyVolume() {
  var all = allSessions();
  var byWeek = {};
  Object.keys(all).sort().forEach(function (d) {
    var S = all[d];
    if (!S) return;
    var v = sessionVolume(S);
    if (!v.vol) return;
    var w = weekStart(d);
    if (!byWeek[w]) byWeek[w] = { vol: 0, sets: 0, days: 0 };
    byWeek[w].vol += v.vol; byWeek[w].sets += v.sets; byWeek[w].days++;
  });
  return byWeek;
}

/** 趋势判定：最近一次 vs 上一次，±2% 以内算持平 */
function trendOf(hist) {
  if (!hist || hist.length < 2) return { dir: 'none', pct: null };
  var last = hist[hist.length - 1].vol, prev = hist[hist.length - 2].vol;
  if (!prev) return { dir: 'none', pct: null };
  var pct = Math.round((last - prev) / prev * 1000) / 10;
  if (pct > 2) return { dir: 'up', pct: pct };
  if (pct < -2) return { dir: 'down', pct: pct };
  return { dir: 'flat', pct: pct };
}

/* ── 视图 ─────────────────────────────────────────────────────── */

/** 所有做过的动作，按「最近一次容量」降序 */
function allExercises() {
  var seen = {}, list = [];
  var all = allSessions();
  Object.keys(all).sort().forEach(function (d) {
    sessionEntries(all[d]).forEach(function (e) {
      if (!e.name || seen[e.name]) return;
      var v = entryVolume(e);
      if (v.vol > 0) { seen[e.name] = 1; list.push(e.name); }
    });
  });
  return list;
}

function bar(pct, cls) {
  var w = Math.max(3, Math.min(100, Math.round(pct)));
  return '<span class="tr-bar ' + (cls || '') + '"><i style="width:' + w + '%"></i></span>';
}

function showVolumeTrend() {
  var names = allExercises();
  var rows = names.map(function (n) {
    var h = exerciseHistory(n);
    return { name: n, hist: h, trend: trendOf(h), last: h[h.length - 1] };
  }).filter(function (x) { return x.last; });

  // 排序：有进步的在前，退步的在后
  var order = { up: 0, flat: 1, none: 2, down: 3 };
  rows.sort(function (a, b) {
    var d = (order[a.trend.dir] || 9) - (order[b.trend.dir] || 9);
    if (d) return d;
    return (b.trend.pct || 0) - (a.trend.pct || 0);
  });

  var h = '<div class="ov-header"><div><div class="title">📊 训练量趋势</div>'
    + '<div class="sub">共 ' + rows.length + ' 个动作 · 按进步幅度排序</div></div>'
    + '<button class="close-btn" onclick="closeView()">✕</button></div>';
  h += '<div class="ov-body">';

  if (!rows.length) {
    h += '<div class="tea-note" style="padding:14px 16px">还没有可分析的训练数据。'
      + '<br>至少记录两次同一个动作，这里才会显示趋势。</div>';
  } else {
    h += '<div class="tr-list">';
    rows.forEach(function (x) {
      var dir = x.trend.dir;
      var arrow = dir === 'up' ? '↑' : dir === 'down' ? '↓' : dir === 'flat' ? '→' : '·';
      var pctTxt = x.trend.pct == null ? '一次记录' : (x.trend.pct > 0 ? '+' : '') + x.trend.pct + '%';
      var maxVol = Math.max.apply(null, x.hist.map(function (y) { return y.vol; }));
      // 迷你走势：最近 6 次
      var mini = x.hist.slice(-6).map(function (y) {
        return '<i style="height:' + Math.max(10, Math.round(y.vol / maxVol * 100)) + '%"></i>';
      }).join('');
      h += '<div class="tr-row" onclick="showExerciseDetail(\'' + x.name.replace(/'/g, "\\'") + '\')">'
        + '<div class="tr-main"><b>' + x.name + '</b>'
        + '<span>' + x.last.date + ' · ' + x.last.sets + ' 组 · 最重 ' + (x.last.topW != null ? x.last.topW + 'kg' : '—') + '</span></div>'
        + '<div class="tr-mini">' + mini + '</div>'
        + '<div class="tr-num"><b>' + x.last.vol.toLocaleString() + '</b><span>kg</span></div>'
        + '<div class="tr-trend ' + dir + '">' + arrow + ' ' + pctTxt + '</div>'
        + '</div>';
    });
    h += '</div>';
  }

  // 按周总容量
  var wk = weeklyVolume();
  var wks = Object.keys(wk).sort();
  if (wks.length) {
    var recent = wks.slice(-8);
    var maxW = Math.max.apply(null, recent.map(function (k) { return wk[k].vol; }));
    h += '<div class="tr-week"><div class="tr-wh">按周总容量</div>';
    recent.forEach(function (k, i) {
      var prev = i > 0 ? wk[recent[i - 1]].vol : null;
      var d = prev ? Math.round((wk[k].vol - prev) / prev * 1000) / 10 : null;
      h += '<div class="tr-wrow">'
        + '<span class="tr-wk">' + k.slice(5) + '</span>'
        + bar(wk[k].vol / maxW * 100, d > 0 ? 'up' : d < 0 ? 'down' : '')
        + '<span class="tr-wv">' + wk[k].vol.toLocaleString() + '</span>'
        + '<span class="tr-wd ' + (d > 0 ? 'up' : d < 0 ? 'down' : '') + '">'
        + (d == null ? '—' : (d > 0 ? '+' : '') + d + '%') + '</span>'
        + '</div>';
    });
    h += '</div>';
  }

  h += '<div class="mea-note">容量 = Σ(重量 × 次数)，<b>热身组不计入</b>。<br>'
    + '同动作连续两次涨跌 ±2% 以内算持平 —— 低于这个幅度是测量噪音，不是趋势。<br>'
    + '⚠️ 单次波动很正常，看的是<b>连续三到四次的走向</b>。</div>';
  h += '<div class="rec-foot"><button class="btn-rec" onclick="closeView()">关闭</button></div>';
  h += '</div>';
  renderMain(h);
}

function showExerciseDetail(name) {
  var hist = exerciseHistory(name);
  var h = '<div class="ov-header"><div><div class="title">' + name + '</div>'
    + '<div class="sub">' + hist.length + ' 次记录 · 总容量趋势</div></div>'
    + '<button class="close-btn" onclick="showVolumeTrend()">✕</button></div>';
  h += '<div class="ov-body">';
  if (!hist.length) { h += '<div class="tea-note" style="padding:14px 16px">没有记录</div>'; }
  else {
    var maxV = Math.max.apply(null, hist.map(function (x) { return x.vol; }));
    h += '<div class="tr-detail">';
    hist.slice().reverse().forEach(function (x, i, arr) {
      var prev = arr[i + 1];
      var d = prev ? Math.round((x.vol - prev.vol) / prev.vol * 1000) / 10 : null;
      h += '<div class="tr-drow">'
        + '<span class="tr-dd">' + x.date.slice(5) + '</span>'
        + bar(x.vol / maxV * 100, d > 0 ? 'up' : d < 0 ? 'down' : '')
        + '<span class="tr-dv">' + x.vol.toLocaleString() + ' kg</span>'
        + '<span class="tr-ds">' + x.sets + '组' + (x.topW != null ? ' · ' + x.topW + 'kg' : '') + '</span>'
        + '<span class="tr-wd ' + (d > 0 ? 'up' : d < 0 ? 'down' : '') + '">'
        + (d == null ? '' : (d > 0 ? '+' : '') + d + '%') + '</span>'
        + '</div>';
    });
    h += '</div>';
    var first = hist[0], last = hist[hist.length - 1];
    var total = first.vol ? Math.round((last.vol - first.vol) / first.vol * 1000) / 10 : null;
    h += '<div class="mea-ratios"><div class="mea-rrow"><span>首次</span><b>' + first.vol.toLocaleString() + '</b><em>' + first.date + '</em></div>'
      + '<div class="mea-rrow"><span>最近</span><b>' + last.vol.toLocaleString() + '</b><em>' + last.date + '</em></div>'
      + '<div class="mea-rrow"><span>累计变化</span><b>' + (total == null ? '—' : (total > 0 ? '+' : '') + total + '%') + '</b><em>'
      + (total > 0 ? '进步' : total < 0 ? '退步' : '') + '</em></div></div>';
  }
  h += '<div class="rec-foot"><button class="btn-rec" onclick="showVolumeTrend()">← 返回列表</button></div>';
  h += '</div>';
  renderMain(h);
}

/* ══════════════════════════════════════════════════════════════════
 * 训练中枢 · 训练计划编辑
 * ------------------------------------------------------------------
 * 在此之前，训练计划是硬编码在 data.public.js 里的常量 ——
 * 想改一个动作或调一次重量，都得改源码。
 *
 * 现在 PLAN / TYPES 降级为**出厂默认模板**，用户改过的部分存在
 * store.plans 里，随账号同步。一套结构同时满足两件事：
 *   1. 用户自己改计划，不用碰源码
 *   2. 产品化时每个用户有自己的计划，而不是所有人都看到同一份硬编码
 *
 * 数据结构：
 *   store.plans = {
 *     types: { 1:'上肢推', 2:'下肢背', ... }   // 星期 → 计划类型（null 表示用默认）
 *     days:  { '上肢推': { day:'…', ex:[…] } } // 只存被改过的计划日
 *     updatedAt
 *   }
 * ══════════════════════════════════════════════════════════════════ */

var Q = "'";                   // 拼 onclick 用，避免反斜杠转义踩坑
var planOpen = -1;             // 当前展开编辑的动作下标，-1 表示都收起
var planEditKey = null;

/** 取（必要时从模板深拷贝出）可编辑的计划对象 */
function planEnsure(ptype) {
  if (!store.plans) store.plans = { types: null, days: {}, updatedAt: null };
  if (!store.plans.days[ptype]) {
    var t = PLAN[ptype];
    if (!t) return null;
    store.plans.days[ptype] = JSON.parse(JSON.stringify(t));
  }
  return store.plans.days[ptype];
}

/* ── 编辑操作 ─────────────────────────────────────────────────── */

function planSetDay(ptype, v) {
  var d = planEnsure(ptype); if (!d) return;
  d.day = v; touchPlans();
}

function planExSet(ptype, i, field, v) {
  var d = planEnsure(ptype); if (!d || !d.ex[i]) return;
  d.ex[i][field] = v;
  touchPlans();
  if (field === 'name') planRender();
}

function planExAdd(ptype) {
  var d = planEnsure(ptype); if (!d) return;
  var n = d.ex.length ? Math.max.apply(null, d.ex.map(function (x) { return x.n || 0; })) + 1 : 1;
  d.ex.push({ n: n, name: '新动作', mus: '', wt: '', sr: '3×10-12', rest: '1.5min', rir: 'RIR 1' });
  planOpen = d.ex.length - 1;
  touchPlans(); planRender();
}

function planExDel(ptype, i) {
  var d = planEnsure(ptype); if (!d) return;
  if (typeof confirm === 'function' && !confirm('删除「' + (d.ex[i] ? d.ex[i].name : '') + '」？')) return;
  d.ex.splice(i, 1);
  d.ex.forEach(function (x, k) { x.n = k + 1; });
  planOpen = -1;
  touchPlans(); planRender();
}

function planExMove(ptype, i, dir) {
  var d = planEnsure(ptype); if (!d) return;
  var j = i + dir;
  if (j < 0 || j >= d.ex.length) return;
  var tmp = d.ex[i]; d.ex[i] = d.ex[j]; d.ex[j] = tmp;
  d.ex.forEach(function (x, k) { x.n = k + 1; });
  planOpen = j;
  touchPlans(); planRender();
}

function planReset(ptype) {
  if (typeof confirm === 'function' && !confirm('把「' + ptype + '」恢复成出厂默认计划？\n你在这个计划上的所有修改都会丢失。')) return;
  if (store.plans && store.plans.days) delete store.plans.days[ptype];
  touchPlans(); planRender(); renderCalendar();
}

function planOpenEx(i) { planOpen = (planOpen === i ? -1 : i); planRender(); }

/* ── 计划总览：所有计划日一屏列完，点进去编辑 ──────────────────
 * 为什么要它：原来唯一的入口在训练日页面的最下面（68% 处），
 * 手机上要滚过全部动作才看得到；而且休息日完全没有入口。
 * 这个页面从日历一步可达，且覆盖全部 7 个计划日。
 */
function showPlanList() {
  var types = getTypes();
  var seen = {}, list = [];
  DOW_ORDER.forEach(function (dow) {
    var n = types[dow];
    if (!n || seen[n]) return;
    seen[n] = 1;
    list.push({ name: n, dow: dow });
  });

/* ══════════════════════════════════════════════════════════════════
 * 训练中枢 · 印章式完成反馈（FR-10）
 * ------------------------------------------------------------------
 * 来源：设计稿「五行暗黑国潮」的五条设计原则之三 ——
 *   「印章式确认：训练完成＝盖红色印章。视觉化的完成感。」
 *
 * 为什么不用普通的勾号/圆点：
 *   日历上已经有圆点表示「这天有记录」。印章要表达的更强一层 ——
 *   **「这天我练完了」**，而且要一眼可辨、有仪式感。
 *
 * 关于「像不像印章」：
 *   干净的方块 + 描边看起来像图标，不像印章。真印章的特征是
 *   **边缘不齐、墨色不匀**。所以这里做了三件事：
 *     1. 用 CSS mask + 噪声渐变在边框上「啃」出缺口
 *     2. 印面叠加不规则墨色（径向渐变 + multiply 混合）
 *     3. 整体轻微旋转，每次角度略有不同（模拟手工盖下的歪斜）
 *   全部用 CSS 实现，不引入图片或字体文件。
 * ══════════════════════════════════════════════════════════════════ */

/** 生成一个印章。
 *  chars: 字符数组。1 个=单字；2 个=竖排；4 个=2×2 田字格（最像传统印章）
 *  size : 边长（px）
 *  cls  : 'red'（训练，默认）| 'green'（茶饮，中医模块恢复后再接）
 */
function sealHtml(chars, size, cls) {
  size = size || 34;
  var list = chars || ['练'];
  var n = list.length;
  var grid = (n === 4) ? 'g4' : (n === 2) ? 'g2' : 'g1';
  var rot = (-8 + (list.join('').charCodeAt(0) % 5)) + 'deg';   // 每个字略不同的角度
  var body = list.map(function (c) { return '<i>' + c + '</i>'; }).join('');
  return '<span class="seal ' + (cls || 'red') + ' ' + grid + '" '
    + 'style="--s:' + size + 'px;--rot:' + rot + '">'
    + '<span class="seal-face">' + body + '</span>'
    + '</span>';
}

/** 这天算不算「练完了」
 *  三条任一成立即算：显式结束过 / 有 summary.done / 是迁移过来的历史存档
 */
function sessionComplete(dsKey) {
  var S = getSession(dsKey);
  if (!S) return !!LOGS[dsKey];
  if (S.finishedAt) return true;
  if (S.summary && /^\d+\/\d+$/.test(String(S.summary.done))) return true;
  return false;
}

/** 日历格子里的迷你印章（单字，够小也能认出） */
function calSealHtml(dsKey) {
  if (!hasLog(dsKey)) return '';
  if (sessionComplete(dsKey)) return '<span class="cal-seal">' + sealHtml(['练'], 16) + '</span>';
  return '<span class="dot"></span>';        // 只记了一部分，仍是圆点
}

/** 全屏「盖下印章」动画 —— 训练完成的那一刻 */
function showSealStamp(chars, cls, title) {
  if (typeof document === 'undefined' || !document.createElement) return;
  var old = document.getElementById('sealStamp');
  if (old && old.remove) old.remove();
  var el = document.createElement('div');
  el.id = 'sealStamp';
  el.className = 'seal-stamp';
  el.innerHTML = '<div class="seal-stamp-in">'
    + sealHtml(chars || ['训', '练', '完', '成'], 108, cls)
    + '<div class="seal-stamp-t">' + (title || '训练完成') + '</div></div>';
  if (document.body) document.body.appendChild(el);
  if (el.remove) setTimeout(function () {
    var e2 = document.getElementById('sealStamp');
    if (e2 && e2.remove) e2.remove();
  }, 2400);
}

function dt(name){
  const d=EXD[name];

  if(d.bre)h+='<div class="dt-sect"><span class="dt-label">bre</span> '+d.bre+'</div>';

  if(!h)h='<div class="dt-sect" style="color:var(--d)">（详情待补充）</div>';

function esc(s){const d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML}

// ── CALENDAR ──
let calY=(new Date()).getFullYear(),calM=(new Date()).getMonth();
function renderCalendar(){
  const today=new Date();const ts=ds(today);
  const first=new Date(calY,calM,1);const startDow=first.getDay();
  const days=new Date(calY,calM+1,0).getDate();
  let h='<div class="cal-nav">';
  h+='<button onclick="navCal(-1)">◀</button>';
  h+='<span class="month-label">'+(calM+1)+'月 '+calY+'</span>';
  h+='<button onclick="navCal(1)">▶</button>';
  h+='</div><div class="cal-dow">';
  ['日','一','二','三','四','五','六'].forEach(d=>h+='<div>'+d+'</div>');
  h+='</div><div class="cal-grid">';
  for(let i=0;i<startDow;i++)h+='<div class="cell"></div>';
  for(let d=1;d<=days;d++){
    const dsKey=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const date=new Date(calY,calM,d);const day=date.getDay();
    const cls=['cell'];if(dsKey===ts)cls.push('today');

    h+='<div class="'+cls.join(' ')+'" onclick="openDay(\''+dsKey+'\')">';

    h+=calSealHtml(dsKey);
    h+='<span class="tag">'+typeKey+'</span>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="cal-tools"><button class="btn-xs" onclick="showMeasure()">📏 围度</button>'
    +'<button class="btn-xs" onclick="showVolumeTrend()">📊 训练量</button>'
    +'<button class="btn-xs" onclick="showPlanList()">📋 计划</button>'
    +'<button class="btn-xs" id="syncBtn" onclick="showAccount()">'+syncLabel()+'</button></div>';
  h+='<div class="cal-tools"><button class="btn-xs" onclick="exportData()">⬇ 导出</button>'
    +'<button class="btn-xs" onclick="document.getElementById(\'importFile\').click()">⬆ 导入</button>'
    +'<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"></div>';
  document.getElementById('calContainer').innerHTML=h;
  document.getElementById('todayLabel').textContent='今天 '+ts;
}

/* 分派：新录入的记录走 showNewLog（逐组、可编辑）；
   历史存档（2026-05~06 的汇总格式）走 showLegacyLog（只读）。 */
function showLog(dsKey,ptype){
  var S=store.sessions[dsKey];
  if(S && S.entries){showNewLog(dsKey,ptype);return;}
  if(S || LOGS[dsKey]){showLegacyLog(dsKey,ptype);return;}
}

function showLegacyLog(dsKey,ptype){
  const L=store.sessions[dsKey]||LOGS[dsKey];if(!L)return;
  const P=getPlan(L.planType);
  const adj=getAdj(L.summary.next);
  const sm=L.summary||{};
  let h=ovHeader(dsKey,'📝 训练实录 · '+L.planType,sm.done||'');
  h+='<div class="ov-body">';
  h+='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">📊</span>训练记录<span class="arrow">▼</span></div><div class="layer-b">';
  const cells=[];
  if(sm.done)cells.push(['✅ 完成率',sm.done,'']);
  if(sm.good)cells.push(['👍 本日亮点',sm.good,'color:var(--gn)']);
  if(sm.bad)cells.push(['⚠️ 问题',sm.bad,'color:var(--rd)']);
  if(sm.adj)cells.push(['🔧 下次调整',sm.adj,'color:var(--gl)']);
  if(cells.length){
    h+='<div class="log-summary">';
    cells.forEach(function(c){h+='<div class="log-item"><div class="log-k">'+c[0]+'</div><div class="log-v"'+(c[2]?' style="'+c[2]+'"':'')+'>'+c[1]+'</div></div>'});
    h+='</div>';
  }
  if(L.actual&&L.actual.length){
    h+='<div class="log-actual">';
    L.actual.forEach(function(a){

var recCurKey = null;

function fmtSets(sets){
  if(!sets||!sets.length)return'—';
  var v=sets.filter(function(x){return x.w!=null||x.r!=null;});
  if(!v.length)return'—';
  var ws=v.map(function(x){return x.w;});
  var uniq=ws.filter(function(x,i){return ws.indexOf(x)===i;});
  if(uniq.length===1){
    var w=uniq[0];
    var wp=(w===0||w==null)?'自重':w+'kg';
    return wp+' · '+v.map(function(x){return x.r==null?'—':x.r;}).join('/');
  }
  return v.map(function(x){return (x.w==null?'?':x.w)+'×'+(x.r==null?'—':x.r);}).join('  ');
}

function inVal(v){return (v===null||v===undefined)?'':v;}

function recButton(dsKey,ptype){
  var P=getPlan(ptype);
  if(!P||!P.ex||!P.ex.length)return'';
  var S=store.sessions[dsKey];
  var has=!!(S&&S.entries);
  var q="\u0027";
  return '<div class="rec-cta">'
    +'<button class="btn-rec" onclick="startWorkout('+q+dsKey+q+')">\u25b6 开始训练</button>'
    +'<button class="btn-xs" style="width:100%;margin-top:6px;padding:9px" onclick="showRec('+q+dsKey+q+')">'
      +(has?'\u270f\ufe0f 编辑记录':'\ud83d\udcdd 手动记录')+'</button>'
    +'</div>';
}

/** 建立（或取回）某天的草稿。新建时用「上次同动作」的数据预填，没有历史就用计划目标。 */
function ensureSession(dsKey){
  if(store.sessions[dsKey])return store.sessions[dsKey];
  var ptype=getPlanType(new Date(dsKey));
  var P=getPlan(ptype);
  var entries=[];
  if(P&&P.ex){
    P.ex.forEach(function(e){
      var last=lastSessionFor(e.name,dsKey);
      var sets=[];
      if(last){
        sets=last.sets.map(function(x){return {w:x.w,r:x.r};});
      }else{
        var m=String(e.sr).match(/^(\d+)\s*×/);
        var n=m?Number(m[1]):3;
        var w=parseFloat(String(e.wt).replace(/[^0-9.]/g,''));
        if(!isFinite(w))w=0;
        for(var i=0;i<n;i++)sets.push({w:w,r:null});
      }
      entries.push({n:e.n,name:e.name,sets:sets,note:''});
    });
  }
  store.sessions[dsKey]={planType:ptype,entries:entries,note:'',draft:true,
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  return store.sessions[dsKey];
}

function showRec(dsKey){
  recCurKey=dsKey;
  ensureSession(dsKey);
  saveStore();
  recRender(dsKey);
}

function recRender(dsKey){
  var S=store.sessions[dsKey];if(!S)return;
  var P=getPlan(S.planType);
  var adj=getAdj(dsKey);
  var h='<div class="ov-header"><div><div class="title">📝 记录训练</div>'
    +'<div class="sub">'+dsKey+' · '+S.planType+'</div></div>'
    +'<button class="close-btn" onclick="closeView()">✕</button></div>';
  h+='<div class="ov-body">';
  if(adj)h+=adjLayer('今日目标（计划调整）',adj);
  h+='<div class="rec-list">';
  S.entries.forEach(function(e,ei){
    var pEx=P?P.ex.filter(function(x){return x.n===e.n;})[0]:null;
    var last=lastSessionFor(e.name,dsKey);
    var hint=last?('上次 '+fmtSets(last.sets)):(pEx?(pEx.wt+' · '+pEx.sr):'首次');
    h+='<div class="rec-ex" id="rec-ex-'+ei+'">';
    h+='<div class="rec-ex-h" onclick="recToggle('+ei+')">'
      +'<span class="rec-n">'+e.n+'</span>'
      +'<span class="rec-name">'+e.name+'</span>'
      +'<span class="rec-last">'+hint+'</span>'
      +'</div>';
    h+='<div class="rec-sets">';
    e.sets.forEach(function(x,si){
      h+='<div class="rec-set">'
        +'<span class="rec-si">'+(si+1)+'</span>'
        +'<input class="rec-in" type="number" inputmode="decimal" step="0.5" value="'+inVal(x.w)+'" placeholder="kg" oninput="recInput('+ei+','+si+',\'w\',this.value)">'
        +'<span class="rec-u">kg</span>'
        +'<input class="rec-in rec-in-r" type="number" inputmode="numeric" value="'+inVal(x.r)+'" placeholder="次" oninput="recInput('+ei+','+si+',\'r\',this.value)">'
        +'<span class="rec-u">次</span>'
        +'<button class="rec-del" onclick="recDelSet('+ei+','+si+')" title="删除这一组">✕</button>'
        +'</div>';
    });
    h+='<button class="rec-add" onclick="recAddSet('+ei+')">+ 加一组</button>';
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div class="rec-note-wrap"><textarea class="rec-note" rows="2" placeholder="备注（状态、肩有没有响、哪里不舒服…）" oninput="recNote(this.value)">'+esc(S.note||'')+'</textarea></div>';
  h+='<div class="rec-foot">'
    +'<button class="btn-rec" onclick="recFinish(\''+dsKey+'\')">✓ 完成</button>'
    +'<button class="btn-xs btn-danger" onclick="recDelete(\''+dsKey+'\')">删除本次</button>'
    +'</div>';
  h+='</div>';
  renderMain(h);
}

function recToggle(ei){
  var el=document.getElementById('rec-ex-'+ei);
  if(el)el.classList.toggle('collapsed');
}

function recInput(ei,si,field,val){
  var S=store.sessions[recCurKey];if(!S)return;
  var e=S.entries[ei];if(!e||!e.sets[si])return;
  var n=parseFloat(val);
  e.sets[si][field]=(val===''||!isFinite(n))?null:(field==='r'?Math.round(n):n);
  touchSession(recCurKey);
}

function recAddSet(ei){
  var S=store.sessions[recCurKey];if(!S)return;
  var e=S.entries[ei];if(!e)return;
  var prev=null;
  for(var i=e.sets.length-1;i>=0;i--){
    if(e.sets[i].w!=null||e.sets[i].r!=null){prev=e.sets[i];break;}
  }
  if(!prev)prev=e.sets[e.sets.length-1]||{w:null,r:null};
  e.sets.push({w:prev.w,r:prev.r});
  touchSession(recCurKey);recRender(recCurKey);
}

function recDelSet(ei,si){
  var S=store.sessions[recCurKey];if(!S)return;
  var e=S.entries[ei];if(!e)return;
  e.sets.splice(si,1);
  touchSession(recCurKey);recRender(recCurKey);
}

function recNote(val){
  var S=store.sessions[recCurKey];if(!S)return;
  S.note=val;touchSession(recCurKey);
}

function recFinish(dsKey){
  var S=store.sessions[dsKey];if(!S)return;
  S.entries.forEach(function(e){
    e.sets=e.sets.filter(function(x){return !(x.w==null&&x.r==null);});
  });
  var done=S.entries.filter(function(e){return e.sets.length;}).length;
  S.summary={done:done+'/'+S.entries.length};
  touchSession(dsKey);
  renderCalendar();
  showLog(dsKey,getPlanType(new Date(dsKey)));
}

function recDelete(dsKey){
  if(typeof confirm==='function'&&!confirm('删除 '+dsKey+' 的记录？不可撤销。'))return;
  var S=store.sessions[dsKey];
  if(S&&isLoggedIn()){
    // 已登录：软删除，这样其它设备才知道「这条被删了」
    S.deletedAt=new Date().toISOString();
    S.updatedAt=S.deletedAt;
    markDirty('session',dsKey);
    saveStore();
  }else{
    delete store.sessions[dsKey];
  }
  renderCalendar();closeView();
}

/** 新格式记录（逐组）的展示 */
function showNewLog(dsKey,ptype){
  var S=store.sessions[dsKey];if(!S)return;
  var adj=getAdj(dsKey);
  var h=ovHeader(dsKey,'📝 训练实录 · '+S.planType,(S.summary&&S.summary.done)||'');
  h+='<div class="ov-body">';
  h+=recButton(dsKey,S.planType);
  h+='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">📊</span>训练记录<span class="arrow">▼</span></div><div class="layer-b">';
  var totalSets=0,vol=0,any=false;
  S.entries.forEach(function(e){
    if(!e.sets||!e.sets.length)return;
    any=true;totalSets+=e.sets.length;
    e.sets.forEach(function(x){if(x.w&&x.r)vol+=x.w*x.r;});
    h+='<div class="la-row"><span class="la-n">'+e.n+'</span><span class="la-name">'+e.name+'</span><span class="la-data">'+fmtSets(e.sets)+'</span></div>';
  });
  if(!any)h+='<div class="tea-note" style="padding:4px 0">还没有录入任何组</div>';
  else h+='<div class="rec-stat">总组数 '+totalSets+' · 总容量 '+Math.round(vol)+' kg</div>';
  if(S.note)h+='<div class="rec-notetext">📝 '+esc(S.note)+'</div>';
  h+='</div></div>';
  h+=adjLayer('当日调整提醒',adj);
  h+=tcmSection(dsKey);
  h+=teaSection(S.planType,dsKey);
  h+=recSection(S.planType);
  h+=nutSection(ptype);
  h+=ovFooter();
  h+='</div>';
  renderMain(h);
}

function exportData(){
  var payload={app:'训练中枢',version:1,exportedAt:new Date().toISOString(),store:store};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='训练中枢-数据-'+ds(new Date())+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

function importData(ev){
  var f=ev.target.files&&ev.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      var inc=(o&&o.store)?o.store:o;
      if(!inc||!inc.sessions)throw new Error('文件里没有 sessions 字段');
      var n=Object.keys(inc.sessions).length;
      if(typeof confirm==='function'&&!confirm('导入 '+n+' 天的记录？同名日期会被文件里的版本覆盖。'))return;
      Object.keys(inc.sessions).forEach(function(k){store.sessions[k]=inc.sessions[k];});
      ['measures','tcm'].forEach(function(g){
        if(inc[g])Object.keys(inc[g]).forEach(function(k){store[g][k]=inc[g][k];});
      });
      saveStore();renderCalendar();
      if(typeof alert==='function')alert('已导入 '+n+' 天记录');
    }catch(e){
      if(typeof alert==='function')alert('导入失败：'+(e&&e.message?e.message:e));
    }
    ev.target.value='';
  };
  r.readAsText(f);
}

var _syncTimer=null;

/** 改动某天的记录：更新时间戳 + 存盘 + 标记待同步 + 排一个延迟同步 */
function touchSession(dsKey){
  var S=store.sessions[dsKey];if(!S)return;
  delete S.draft;                       // 一旦真的改了东西，就不再是草稿
  S.updatedAt=new Date().toISOString();
  markDirty('session',dsKey);
  saveStore();
  scheduleSync();
}

function scheduleSync(){
  if(!isLoggedIn())return;
  if(_syncTimer)clearTimeout(_syncTimer);
  _syncTimer=setTimeout(function(){_syncTimer=null;syncNow();},3000);
}

function syncStatusText(){
  return {idle:'空闲',syncing:'同步中…',ok:'已同步',error:'同步失败',offline:'离线（稍后重试）',noauth:'未登录'}[syncStatus]||syncStatus;
}
function syncLabel(){
  return {idle:'☁ 账号',syncing:'☁ 同步中…',ok:'☁ 已同步',error:'☁ 同步失败',offline:'☁ 离线',noauth:'☁ 登录'}[syncStatus]||'☁ 账号';
}
/** 只更新按钮文字，不整页重绘 */
function refreshSyncUI(){
  var b=document.getElementById('syncBtn');
  if(b)b.textContent=syncLabel();
  var s=document.getElementById('accStatus');
  if(s)s.textContent=syncStatusText();
  var d=document.getElementById('accDirty');
  if(d)d.textContent=Object.keys(syncState.dirty).length+' 条';
  var e=document.getElementById('accErr');
  if(e)e.textContent=syncError||'';
}

function accMsg(t,cls){
  var el=document.getElementById('accMsg');
  if(el){el.textContent=t;el.className='acc-msg '+(cls||'');}
}

async function doAuth(mode){
  var e=document.getElementById('accEmail'), p=document.getElementById('accPw');
  var email=e?e.value.trim():'', pw=p?p.value:'';
  if(!email||!pw){accMsg('请填写邮箱和密码','err');return;}
  if(pw.length<6){accMsg('密码至少 6 位','err');return;}
  accMsg(mode==='up'?'注册中…':'登录中…','');
  try{
    if(mode==='up'){
      var r=await sbSignUp(email,pw);
      if(r.needConfirm){accMsg('注册成功，但该项目开启了邮箱确认 —— 请到邮箱点确认链接后再登录','ok');return;}
    }else{
      await sbSignIn(email,pw);
    }
    accMsg('登录成功，正在同步…','ok');
    var res=await syncNow();
    if(res.ok){renderCalendar();showAccount();}
    else accMsg('登录成功，但同步失败：'+(res.message||res.reason),'err');
  }catch(err){
    accMsg('失败：'+((err&&err.message)||err),'err');
  }
}

async function doSync(){
  accMsg('同步中…','');
  var r=await syncNow();
  if(r.ok){accMsg('同步完成（下载 '+r.pulled+' 条，上传 '+r.pushed+' 条）','ok');renderCalendar();}
  else accMsg('同步失败：'+(r.message||r.reason),'err');
  refreshSyncUI();
}

async function doSignOut(){
  if(typeof confirm==='function'&&!confirm('退出登录？本机数据会保留，但不再上传。'))return;
  await sbSignOut();
  renderCalendar();closeView();
}

/** 启动时自动同步一次；回到前台/恢复联网也同步 */
function syncBootstrap(){
  if(legacyMigrated)console.log('已迁移 '+legacyMigrated+' 条历史数据到本地库，登录后会自动上传');
  if(!isLoggedIn())return;
  setTimeout(function(){syncNow();},1500);
  if(typeof window!=='undefined'&&window.addEventListener){
    window.addEventListener('online',function(){syncNow();});
    document.addEventListener('visibilitychange',function(){
      if(!document.hidden)syncNow();
    });
  }
}
