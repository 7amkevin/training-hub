<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>训练中枢</title>
<meta name="description" content="练·吃·茶·量·恢复 — 个人训练中枢">
<meta name="theme-color" content="#060608">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="训练中枢">
<style>
/* ═══════ RESET & BASE ═══════ */
:root{--bg:#060608;--c1:#0c0d10;--c2:#111318;--b:#1c1d24;--t:#c8c8cc;--d:#5a5a60;--gl:#c89640;--rd:#e05040;--gn:#50a060;--bl:#5090c0;--cy:#40b8b0;--pp:#9060b8;--br:8px;--sh:0 2px 8px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.5;min-height:100vh}
a{color:var(--pp);text-decoration:none}

/* ═══════ LAYOUT ═══════ */
.app{display:flex;max-width:1100px;margin:0 auto;min-height:100vh}
.sidebar{width:260px;flex-shrink:0;background:var(--c2);border-right:1px solid var(--b);padding:12px;display:flex;flex-direction:column;gap:10px}
.main{flex:1;padding:12px 16px;overflow-y:auto;max-height:100vh}

/* ═══════ HEADER ═══════ */
.app-title{font-size:1rem;font-weight:700;color:var(--t);padding:8px 12px;text-align:center;background:linear-gradient(135deg,#0a0c14,#060810);border-radius:var(--br);border:1px solid var(--b)}
.app-title span{color:var(--gl)}

/* ═══════ CALENDAR ═══════ */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.cal-nav button{background:none;border:none;color:var(--t);cursor:pointer;font-size:.9rem;padding:2px 8px;border-radius:4px}
.cal-nav button:hover{background:var(--c1)}
.cal-nav .month-label{font-weight:700;font-size:.85rem}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.6rem;color:var(--d);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-grid .cell{padding:6px 2px;border-radius:4px;cursor:pointer;position:relative;font-size:.72rem;min-height:32px;transition:background .15s}
.cal-grid .cell:hover{background:var(--c1)}
.cal-grid .cell.today{background:var(--c1);font-weight:700;color:var(--gl)}
.cal-grid .cell .n{display:block}
.cal-grid .cell .dot{width:5px;height:5px;border-radius:50%;background:var(--gn);position:absolute;bottom:3px;left:50%;transform:translateX(-50%)}
.cal-grid .cell .tag{font-size:.5rem;color:var(--d);margin-top:2px;display:block;line-height:1}

/* ═══════ PANELS ═══════ */
.ov-header{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 16px;background:var(--c2);border-radius:var(--br) var(--br) 0 0;border:1px solid var(--b);border-bottom:none}
.ov-header .title{font-size:.95rem;font-weight:700}
.ov-header .sub{font-size:.7rem;color:var(--d)}
.ov-header .close-btn{background:none;border:none;color:var(--d);cursor:pointer;font-size:1.1rem}
.ov-header .close-btn:hover{color:var(--rd)}
.ov-body{border:1px solid var(--b);border-top:none;border-radius:0 0 var(--br) var(--br);padding:0}
.ov-body .layer{border-bottom:1px solid var(--b)}
.ov-body .layer:last-child{border-bottom:none}
.layer-h{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--t);user-select:none}
.layer-h:hover{background:var(--c1)}
.layer-h .icon{font-size:.85rem}
.layer-h .arrow{font-size:.6rem;color:var(--d);transition:transform .2s;margin-left:auto}
.layer.collapsed .layer-b{display:none}
.layer.collapsed .arrow{transform:rotate(-90deg)}
.layer-b{padding:8px 16px 12px;font-size:.75rem;color:var(--d);line-height:1.7}

/* ═══════ EXERCISE ROW ═══════ */
.ex-row{border-top:1px solid var(--b);cursor:pointer}
.ex-row:first-child{border-top:none}
.ex-sum{padding:6px 12px;font-size:.73rem;white-space:nowrap;overflow:hidden}
.ex-sum .ex-n{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c1);text-align:center;line-height:18px;font-size:.6rem;font-weight:700;color:var(--t);vertical-align:middle;margin-right:6px}
.ex-sum .ex-name{font-weight:600;color:var(--t);vertical-align:middle;margin-right:8px}
.ex-sum .ex-tag{display:inline-block;padding:1px 5px;background:var(--c1);border-radius:3px;font-size:.6rem;color:var(--d);vertical-align:middle;margin-right:4px}
.ex-detail{display:none;padding:0 16px 12px 44px;font-size:.7rem;color:var(--d);line-height:1.7}
.ex-row.open .ex-detail{display:block}
.ex-detail b{color:var(--t)}
.ex-detail .dt-sect{margin-top:6px}
.ex-detail .dt-sect .dt-label{color:var(--gl);font-weight:600;font-size:.68rem;margin-bottom:2px}

/* ═══════ TEA / FORMULA ═══════ */
.tea-base{font-size:.78rem;color:var(--t);padding:6px 0}
.tea-adj{font-size:.75rem;color:var(--rd);font-weight:600;padding:4px 0}
.tea-special{font-size:.68rem;color:var(--d)}
.tea-note{font-size:.66rem;color:var(--pp);padding:2px 0}
.tea-note.warn{color:var(--rd)}

/* ═══════ LOG TABLE ═══════ */
.log-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 16px;font-size:.7rem}
.log-summary .log-item{background:var(--c1);padding:8px 10px;border-radius:var(--br)}
.log-summary .log-item .log-k{color:var(--d);font-size:.62rem}
.log-summary .log-item .log-v{color:var(--t);font-weight:600;margin-top:2px}
.log-actual{padding:8px 16px}
.log-actual .la-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.7rem;border-bottom:1px solid var(--b)}
.log-actual .la-row .la-n{width:18px;text-align:center;font-weight:700;color:var(--d)}
.log-actual .la-row .la-name{flex:1;color:var(--t)}
.log-actual .la-row .la-data{color:var(--d);text-align:right}

/* ═══════ NUTRITION ═══════ */
.meal-row{padding:6px 0;font-size:.72rem;border-bottom:1px solid var(--b)}
.meal-row:last-child{border-bottom:none}
.meal-row .meal-name{font-weight:600;color:var(--t)}
.meal-row .meal-items{color:var(--d);font-size:.68rem}
.meal-row .meal-macros{color:var(--gl);font-size:.65rem}

/* ═══════ RECOVERY ═══════ */
.rec-item{display:flex;gap:8px;padding:4px 0;font-size:.72rem}
.rec-item .rec-act{color:var(--t);flex:1}
.rec-item .rec-dur{color:var(--d);font-size:.68rem}

/* ═══════ EMPTY STATE ═══════ */
.empty{text-align:center;padding:30px;color:var(--d);font-size:.78rem}

/* ═══════ BUTTONS ═══════ */
.btn-sm{font-size:.65rem;padding:4px 10px;border:1px solid var(--b);background:var(--c1);color:var(--t);border-radius:4px;cursor:pointer}
.btn-sm:hover{background:var(--b)}
.btn-accent{background:var(--pp);color:#fff;border:none;padding:6px 14px;border-radius:var(--br);font-size:.7rem;cursor:pointer;font-weight:600}
.btn-accent:hover{opacity:.85}

/* ═══════ TCM LOG ═══════ */
.tcm-card{background:var(--c1);border-radius:var(--br);padding:10px 12px;margin:6px 0}
.tcm-card .tcm-row{font-size:.7rem;padding:3px 0}
.tcm-card .tcm-row .tcm-k{color:var(--d)}
.tcm-card .tcm-row .tcm-v{color:var(--t)}

/* ═══════ MOBILE ═══════ */
@media(max-width:768px){
  .app{display:block;max-width:100%}
  .sidebar{width:100%;max-height:none;overflow:visible;border-right:none;border-bottom:2px solid var(--b);padding:8px 10px;gap:4px;position:static}
  .main{max-height:none;padding:8px 4px;width:100%}
  .app-title{padding:6px 10px;font-size:.9rem}
  .cal-nav button{font-size:.8rem;padding:2px 6px}
  .cal-nav .month-label{font-size:.8rem}
  .cal-dow{font-size:.55rem}
  .cal-grid .cell{padding:5px 1px;min-height:26px;font-size:.68rem}
  .cal-grid .cell .tag{font-size:.45rem}
  .ex-row .ex-sum{font-size:.68rem;padding:5px 8px}
  .ex-sum .ex-n{width:16px;height:16px;line-height:16px;font-size:.55rem;margin-right:4px}
  .ex-sum .ex-name{font-size:.65rem;margin-right:4px}
  .ex-sum .ex-tag{font-size:.55rem;padding:1px 3px;margin-right:2px}
  .ov-header{padding:8px 10px;border-radius:0}
  .ov-header .title{font-size:.82rem}
  .ov-header .sub{font-size:.65rem}
  .ov-body{border-radius:0}
  .layer-h{padding:7px 10px;font-size:.7rem}
  .layer-b{padding:6px 10px 10px;font-size:.68rem}
  .log-summary{grid-template-columns:1fr}
  .meal-row{font-size:.68rem}
}


/* ═══════ 训练记录录入（FR-01 / FR-02）═══════ */
.cal-tools{display:flex;gap:6px;justify-content:center;padding:6px 12px 2px}
.btn-xs{font:inherit;font-size:.68rem;padding:5px 10px;border-radius:6px;border:1px solid var(--b);background:var(--c2);color:var(--d);cursor:pointer}
.btn-xs:active{background:var(--c1)}
.btn-danger{color:var(--rd);border-color:#3a2020}
.rec-cta{padding:8px 16px}
.btn-rec{width:100%;font:inherit;font-size:.82rem;font-weight:600;padding:11px;border-radius:8px;border:1px solid var(--gl);background:linear-gradient(180deg,#2a2114,#1a160d);color:var(--gl);cursor:pointer}
.btn-rec:active{opacity:.8}
.btn-rec-edit{border-color:var(--b);background:var(--c2);color:var(--t)}
.rec-list{padding:0 12px}
.rec-ex{border:1px solid var(--b);border-radius:8px;margin-bottom:8px;overflow:hidden;background:var(--c1)}
.rec-ex-h{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer}
.rec-n{flex:0 0 18px;text-align:center;font-size:.66rem;color:var(--d);border:1px solid var(--b);border-radius:4px;padding:1px 0}
.rec-name{flex:1 1 auto;min-width:0;font-size:.82rem;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-last{flex:0 0 auto;font-size:.62rem;color:var(--d);white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.rec-ex.collapsed .rec-sets{display:none}
.rec-sets{padding:0 10px 9px}
.rec-set{display:flex;align-items:center;gap:6px;padding:3px 0}
.rec-si{flex:0 0 16px;text-align:center;font-size:.64rem;color:var(--d)}
.rec-in{flex:1 1 0;min-width:0;font:inherit;font-size:.82rem;text-align:center;padding:6px 4px;border-radius:6px;border:1px solid var(--b);background:#0a0b0e;color:var(--t)}
.rec-in:focus{outline:none;border-color:var(--gl)}
.rec-in-r{flex:0 0 62px}
.rec-u{flex:0 0 auto;font-size:.6rem;color:var(--d)}
.rec-del{flex:0 0 auto;font:inherit;font-size:.7rem;padding:5px 7px;border-radius:5px;border:1px solid var(--b);background:transparent;color:var(--d);cursor:pointer}
.rec-del:active{color:var(--rd)}
.rec-add{width:100%;font:inherit;font-size:.68rem;padding:6px;margin-top:4px;border-radius:6px;border:1px dashed var(--b);background:transparent;color:var(--d);cursor:pointer}
.rec-note-wrap{padding:4px 12px 0}
.rec-note{width:100%;box-sizing:border-box;font:inherit;font-size:.76rem;padding:8px;border-radius:8px;border:1px solid var(--b);background:#0a0b0e;color:var(--t);resize:vertical}
.rec-note:focus{outline:none;border-color:var(--gl)}
.rec-foot{display:flex;gap:8px;align-items:center;padding:12px}
.rec-foot .btn-rec{flex:1 1 auto;width:auto}
.rec-stat{padding:6px 16px 2px;font-size:.66rem;color:var(--gl)}
.rec-notetext{padding:2px 16px 6px;font-size:.72rem;color:var(--t);line-height:1.5}


/* ═══════ 账号与同步 ═══════ */
.acc-box{padding:10px 16px 16px}
.acc-label{display:block;font-size:.66rem;color:var(--d);margin:10px 0 4px}
.acc-in{width:100%;box-sizing:border-box;font:inherit;font-size:.85rem;padding:10px;border-radius:8px;border:1px solid var(--b);background:#0a0b0e;color:var(--t)}
.acc-in:focus{outline:none;border-color:var(--gl)}
.acc-msg{min-height:1.2em;font-size:.72rem;padding:8px 0 2px;color:var(--d)}
.acc-msg.err{color:var(--rd)}
.acc-msg.ok{color:var(--gn)}
.acc-note{font-size:.66rem;color:var(--d);line-height:1.6;padding:12px 0 0;border-top:1px solid var(--b);margin-top:14px}
.acc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--b);font-size:.76rem;color:var(--d)}
.acc-row b{color:var(--t);font-weight:600}
.acc-err{font-size:.68rem;color:var(--rd);padding:8px 0;word-break:break-all}
.acc-err:empty{display:none}


/* ═══════ 训练模式（FR-16 / FR-17）═══════ */
.wo-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:.68rem;color:var(--d);border-bottom:1px solid var(--b)}
.wo-bar b{color:var(--gl);font-weight:600}
.wo-card{margin:10px 12px 0;padding:10px 12px;border:1px solid var(--b);border-radius:8px;background:var(--c1)}
.wo-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wo-nav .btn-xs{min-width:44px}
.wo-nav .btn-xs:disabled{opacity:.35}
.wo-idx{font-size:.68rem;color:var(--d)}
.wo-title{font-size:1rem;font-weight:600;color:var(--t);padding:8px 0 4px}
.wo-meta{font-size:.66rem;color:var(--d);line-height:1.6}
.wo-sets{padding:10px 12px 0}
.wo-set{display:flex;align-items:center;gap:6px;padding:4px 0}
.wo-set.done{opacity:.55}
.wo-set.done .rec-in{text-decoration:line-through}
.wo-set.cur .wo-si{background:var(--gl);color:#0a0b0e;border-color:var(--gl)}
.wo-si{flex:0 0 22px;text-align:center;font-size:.66rem;color:var(--d);border:1px solid var(--b);border-radius:5px;padding:3px 0;cursor:pointer;user-select:none}
.rec-in.warm{border-color:#3a3320;color:var(--d)}
.wo-ck{flex:0 0 auto;font:inherit;font-size:.66rem;padding:6px 8px;border-radius:6px;border:1px solid var(--b);background:var(--c2);color:var(--d);cursor:pointer;white-space:nowrap}
.wo-ck.on{background:#1a2a1c;border-color:var(--gn);color:var(--gn);font-size:.8rem;padding:4px 10px}
.wo-foot{display:flex;gap:6px;align-items:center;padding:12px;border-top:1px solid var(--b);margin-top:12px}
.wo-foot .btn-xs{white-space:nowrap}
.wo-foot .btn-xs:disabled{opacity:.35}

/* 休息计时器浮层 */
.wo-timer{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(3,3,5,.9);backdrop-filter:blur(3px)}
.wo-timer-in{width:min(300px,84vw);text-align:center;padding:22px 18px;border:1px solid var(--b);border-radius:14px;background:var(--c1);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.wo-timer-k{font-size:.7rem;color:var(--d);margin-bottom:10px}
.wo-timer-v{font-size:3.1rem;font-weight:700;color:var(--gl);font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1}
.wo-timer-bar{height:4px;border-radius:2px;background:var(--b);margin:18px 0 16px;overflow:hidden}
.wo-timer-bar i{display:block;height:100%;background:var(--gl);transition:width .25s linear}
.wo-timer-btns{display:flex;gap:8px;justify-content:center}
.wo-timer-btns button{flex:1 1 0;font:inherit;font-size:.76rem;padding:10px 4px;border-radius:8px;border:1px solid var(--b);background:var(--c2);color:var(--t);cursor:pointer}
.wo-timer-btns button:active{background:var(--b)}


/* ═══════ 训练模式补充：热身组 / 计时结束提示 / 试听 ═══════ */
.wo-sndmsg{min-height:1em;padding:0 16px 2px;font-size:.62rem;color:var(--gn)}
.wo-sndmsg:empty{display:none}
.wo-set.warm{background:rgba(200,150,64,.05);border-radius:6px;margin:2px 0;padding:4px 6px}
.wo-set.warm .wo-si{color:var(--gl);border-color:var(--gl)}
.wo-set.warm .rec-in{border-style:dashed}
.wo-addrow{display:flex;gap:6px;margin-top:6px}
.wo-addrow .rec-add{margin-top:0}
.wo-hint{font-size:.58rem;color:var(--d);text-align:center;padding:8px 4px 0;line-height:1.5}

/* 休息结束的视觉兜底（iPhone 没有震动，声音可能被静音） */
.wo-alert{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(10,30,14,.88);backdrop-filter:blur(2px);animation:woflash .5s ease-out}
@keyframes woflash{from{opacity:0}to{opacity:1}}
.wo-alert-in{text-align:center;font-size:2rem;font-weight:700;color:var(--gn);line-height:1.5}
.wo-alert-in span{display:block;font-size:.85rem;font-weight:400;color:var(--t);margin-top:8px}


/* ═══════ 提示音选择 ═══════ */
.snd-list{padding:0 12px}
.snd-row{display:flex;align-items:center;gap:8px;padding:11px 12px;border:1px solid var(--b);border-radius:8px;margin-bottom:7px;background:var(--c1);cursor:pointer}
.snd-row.on{border-color:var(--gl);background:rgba(200,150,64,.08)}
.snd-main{flex:1 1 auto;min-width:0}
.snd-main b{display:block;font-size:.85rem;color:var(--t)}
.snd-main span{display:block;font-size:.62rem;color:var(--d);margin-top:2px}
.snd-ck{flex:0 0 auto;color:var(--gl);font-weight:700;padding-left:2px}
.snd-note{margin:14px 12px 0;padding:12px 0 0;border-top:1px solid var(--b);font-size:.66rem;color:var(--d);line-height:1.7}
.snd-note b{color:var(--t)}

/* 到点提醒：重复闪 */
.wo-alert.ping{animation:woping .5s ease-out}
@keyframes woping{0%{background:rgba(80,160,96,.55)}100%{background:rgba(10,30,14,.88)}}
.wo-alert-ok{display:block;margin:22px auto 0;font:inherit;font-size:.9rem;font-weight:600;padding:12px 40px;border-radius:10px;border:1px solid var(--gn);background:rgba(80,160,96,.15);color:var(--gn);cursor:pointer}
.wo-alert-ok:active{background:rgba(80,160,96,.3)}


/* ═══════ 身体围度（FR-03）═══════ */
.mea-group{padding:0 12px;margin-bottom:12px}
.mea-gh{font-size:.62rem;color:var(--gl);letter-spacing:.08em;padding:6px 2px 4px;border-bottom:1px solid var(--b);margin-bottom:4px}
.mea-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.mea-n{flex:0 0 62px;font-size:.74rem;color:var(--t)}
.mea-in{flex:1 1 0;min-width:0;font:inherit;font-size:.85rem;text-align:center;padding:7px 4px;border-radius:6px;border:1px solid var(--b);background:#0a0b0e;color:var(--t)}
.mea-in:focus{outline:none;border-color:var(--gl)}
.mea-u{flex:0 0 22px;font-size:.6rem;color:var(--d)}
.mea-prev{flex:0 0 62px;font-size:.58rem;color:var(--d);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mea-d{flex:0 0 42px;font-size:.62rem;text-align:right;white-space:nowrap}
.mea-ratios{margin:6px 12px 0;padding:10px 12px;border:1px solid var(--b);border-radius:8px;background:var(--c1)}
.mea-rrow{display:flex;align-items:baseline;gap:8px;padding:4px 0;font-size:.72rem;color:var(--d)}
.mea-rrow b{color:var(--gl);font-size:.92rem}
.mea-rrow em{font-style:normal;font-size:.6rem;color:var(--d);margin-left:auto;text-align:right}
.mea-rhint{font-size:.68rem;color:var(--d);text-align:center;padding:4px 0}
.mea-note{margin:12px 12px 0;padding-top:10px;border-top:1px solid var(--b);font-size:.64rem;color:var(--d);line-height:1.7}
.mea-note b{color:var(--t)}
.mea-tw{overflow-x:auto;padding:0 12px}
.mea-tbl{width:100%;border-collapse:collapse;font-size:.66rem}
.mea-tbl th{color:var(--d);font-weight:400;padding:6px 4px;text-align:center;border-bottom:1px solid var(--b);white-space:nowrap}

/* ═══════ 印章（FR-10）═══════
 * 靠三件事做出「印章感」而不是「图标感」：
 *   1. mask 上的噪声渐变在边框上啃出缺口
 *   2. 印面叠加不规则墨色 + multiply 混合
 *   3. 轻微旋转，每次角度略有不同
 */
.seal{
  --s:34px; --rot:-7deg;
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  width:var(--s); height:var(--s); flex:0 0 auto;
  transform:rotate(var(--rot));
  color:#c8443a;
  font-family:"STKaiti","KaiTi","Songti SC","SimSun",serif;
  font-weight:700; font-style:normal;
  -webkit-user-select:none; user-select:none;
  -webkit-mask-image:
    radial-gradient(circle at 12% 8%, transparent 3.2px, #000 3.2px),
    radial-gradient(circle at 91% 17%, transparent 2.6px, #000 2.6px),
    radial-gradient(circle at 6% 74%, transparent 2.2px, #000 2.2px),
    radial-gradient(circle at 84% 93%, transparent 3.4px, #000 3.4px),
    radial-gradient(circle at 47% 2%, transparent 1.8px, #000 1.8px);
  mask-image:
    radial-gradient(circle at 12% 8%, transparent 3.2px, #000 3.2px),
    radial-gradient(circle at 91% 17%, transparent 2.6px, #000 2.6px),
    radial-gradient(circle at 6% 74%, transparent 2.2px, #000 2.2px),
    radial-gradient(circle at 84% 93%, transparent 3.4px, #000 3.4px),
    radial-gradient(circle at 47% 2%, transparent 1.8px, #000 1.8px);
}
.seal.green{color:#4f9d6e}
.seal-face{
  display:grid; gap:calc(var(--s)*.03);
  width:calc(var(--s)*.82); height:calc(var(--s)*.82);
  border:calc(var(--s)*.075) solid currentColor;
  border-radius:calc(var(--s)*.1);
  padding:calc(var(--s)*.05);
  box-sizing:border-box;
  background:
    radial-gradient(circle at 30% 24%, currentColor 0%, transparent 55%),
    radial-gradient(circle at 78% 82%, currentColor 0%, transparent 48%);
  background-size:100% 100%;
  opacity:.94;
  mix-blend-mode:screen;
}
.seal.g1 .seal-face{grid-template-columns:1fr; grid-template-rows:1fr}
.seal.g2 .seal-face{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
.seal.g4 .seal-face{grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr}
.seal-face i{
  font-style:normal; display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--s)*.34); line-height:1; letter-spacing:0;
}
.seal.g1 .seal-face i{font-size:calc(var(--s)*.52)}
.seal.g4 .seal-face i{font-size:calc(var(--s)*.3)}

/* 日历格子里的迷你印章 */
.cal-seal{position:absolute; bottom:1px; left:50%; transform:translateX(-50%); line-height:0; pointer-events:none}
.cal-seal .seal{--rot:-9deg; opacity:.92}
.cal-seal .seal-face{border-width:calc(var(--s)*.11); border-radius:calc(var(--s)*.12)}
.cal-seal .seal-face i{font-size:calc(var(--s)*.5)}

/* 全屏盖章动画 */
.seal-stamp{position:fixed; inset:0; z-index:320; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 50% 46%, rgba(200,68,58,.10), rgba(3,3,5,.86) 62%);
  animation:sealFade .35s ease-out}
@keyframes sealFade{from{opacity:0}to{opacity:1}}
.seal-stamp-in{text-align:center}
.seal-stamp .seal{animation:sealSlam .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sealSlam{
  0%{transform:rotate(var(--rot)) scale(2.6); opacity:0; filter:blur(4px)}
  45%{transform:rotate(var(--rot)) scale(.92); opacity:1; filter:blur(0)}
  62%{transform:rotate(var(--rot)) scale(1.06)}
  80%{transform:rotate(var(--rot)) scale(.98)}
  100%{transform:rotate(var(--rot)) scale(1)}
}
.seal-stamp-t{margin-top:18px; font-size:.82rem; color:#c89640; letter-spacing:.35em; text-indent:.35em;
  animation:sealT .6s .45s ease-out both}
@keyframes sealT{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
</style>

/* 公开版 · 个人数据层已剔除，以下为同名空对象占位（保证代码可运行） */
/* 原始对象：LOGS / ADJ / TCM_LOG */
const LOGS={};
const ADJ={};
const TCM_LOG={};

/* ══════════════════════════════════════════════════════════════════
 * 训练中枢 · 本地存储层
 * ------------------------------------------------------------------
 * 所有录入的数据都存在浏览器 localStorage 里，**永不上传、永不进源码**。
 *
 * 为什么不用源码存数据：以前每次记一次训练都要打开编辑器改 HTML，
 * 摩擦太大 → 记录链条断了 107 天。录入必须能在 App 内完成。
 *
 * 数据结构：
 *   {
 *     version: 1,
 *     sessions: { 'YYYY-MM-DD': Session },
 *     measures: {},   ← 预留：身体围度（FR-03）
 *     tcm:      {}    ← 预留：舌诊录入（FR-12）
 *   }
 *
 *   Session = {
 *     planType: '上肢推',
 *     entries: [ { n:1, name:'平板杠铃卧推', sets:[ {w:65,r:8}, ... ], note:'' } ],
 *     note: '',
 *     createdAt, updatedAt
 *   }
 *
 * 说明：Node 环境（回归测试）没有 localStorage，会退回内存实现，
 *       这样测试也能覆盖全部读写逻辑。
 * ══════════════════════════════════════════════════════════════════ */

const LS_KEY = 'zx.store.v1';

var _mem = {};
var _ls = (typeof localStorage !== 'undefined' && localStorage) ? localStorage : {
  getItem: function (k) { return Object.prototype.hasOwnProperty.call(_mem, k) ? _mem[k] : null; },
  setItem: function (k, v) { _mem[k] = String(v); },
  removeItem: function (k) { delete _mem[k]; }
};

function emptyStore() { return { version: 1, sessions: {}, measures: {}, tcm: {}, adj: {}, plans: { types: null, days: {}, updatedAt: null } }; }

function loadStore() {
  var o = null;
  try { o = JSON.parse(_ls.getItem(LS_KEY) || 'null'); } catch (e) { o = null; }
  if (!o || typeof o !== 'object') o = emptyStore();
  if (!o.sessions || typeof o.sessions !== 'object') o.sessions = {};
  if (!o.measures || typeof o.measures !== 'object') o.measures = {};
  if (!o.tcm || typeof o.tcm !== 'object') o.tcm = {};
  if (!o.adj || typeof o.adj !== 'object') o.adj = {};
  if (!o.plans || typeof o.plans !== 'object') o.plans = { types: null, days: {}, updatedAt: null };
  if (!o.plans.days || typeof o.plans.days !== 'object') o.plans.days = {};
  o.version = 1;
  return o;
}

var store = loadStore();

function saveStore() {
  try { _ls.setItem(LS_KEY, JSON.stringify(store)); return true; }
  catch (e) {
    if (typeof alert === 'function') alert('保存失败：' + (e && e.message ? e.message : e));
    return false;
  }
}

/* ── 查询 ────────────────────────────────────────────────────────── */

/** 某天是否有记录（新录入或历史存档） */
function isDeleted(v) { return !!(v && v.deletedAt); }

/* ── 训练计划：用户自定义优先，内置模板兜底 ──────────────────────
 * PLAN / TYPES 在 data.public.js 里，是**出厂默认模板**。
 * 用户改过的部分存在 store.plans，会随账号同步。
 * 这样一套结构同时满足两件事：
 *   1. 用户自己改计划，不用碰源码
 *   2. 产品化时每个用户有自己的计划，而不是共享同一份硬编码
 */
function getTypes() {
  var u = store.plans && store.plans.types;
  return (u && Object.keys(u).length) ? u : TYPES;
}

function getPlan(ptype) {
  var u = store.plans && store.plans.days && store.plans.days[ptype];
  if (u && u.ex) return u;
  return PLAN[ptype] || null;
}

/** 该计划日是否被用户改过（用于「恢复默认」按钮的显示） */
function isPlanCustom(ptype) {
  return !!(store.plans && store.plans.days && store.plans.days[ptype]);
}

function touchPlans() {
  if (!store.plans) store.plans = { types: null, days: {}, updatedAt: null };
  store.plans.updatedAt = new Date().toISOString();
  markDirty('plan', '1970-01-01');
  saveStore();
  if (typeof scheduleSync === 'function') scheduleSync();
}

/** 组数合计：从动作表实时算，避免与声明值不一致 */
function planTotal(P) {
  if (!P) return '';
  if (!P.ex || !P.ex.length) return P.total || '';
  var n = P.ex.reduce(function (a, e) {
    var m = String(e.sr).match(/^(\d+)\s*×/); return a + (m ? Number(m[1]) : 0);
  }, 0);
  return n > 0 ? n + '组' : (P.total || '');
}

/** 单日调整：优先取本地（含云端同步来的），回落到源码里的历史存档 */
function getAdj(dsKey) { var v = store.adj[dsKey]; return v || ADJ[dsKey] || null; }

/** 舌诊：同上 */
function getTcm(dsKey) { var v = store.tcm[dsKey]; return v || TCM_LOG[dsKey] || null; }

/** 这条会话到底有没有实质内容？
 *  为什么需要：ensureSession() 在用户一打开记录界面时就建了空壳，
 *  如果不加区分，「点开过」就会在日历上留下记录标记。 */
function sessionHasData(S) {
  if (!S) return false;
  if (S.draft) return false;      // 只是打开过记录界面，还没有任何录入
  if (S.actual && S.actual.length) return true;
  var ents = S.entries || [];
  for (var i = 0; i < ents.length; i++) {
    var sets = ents[i].sets || [];
    for (var j = 0; j < sets.length; j++) {
      if (sets[j].w != null || sets[j].r != null) return true;
    }
  }
  return false;
}

function hasLog(dsKey) {
  var S = getSession(dsKey);
  if (S && sessionHasData(S)) return true;
  return !!LOGS[dsKey];
}

/** 取某天的新格式记录（没有则 null） */
function getSession(dsKey) { var v = store.sessions[dsKey]; return (v && !v.deletedAt) ? v : null; }

/** 全部记录合并视图：新录入优先，历史存档兜底 */
function allSessions() {
  var out = {};
  Object.keys(LOGS || {}).forEach(function (k) { out[k] = LOGS[k]; });
  Object.keys(store.sessions).forEach(function (k) { if (!isDeleted(store.sessions[k])) out[k] = store.sessions[k]; });
  return out;
}

/** 把历史存档（汇总式 'rep 6·6·6·5'）粗略解析成逐组，仅用于「上次」预填。
 *  解析不准没关系——数值会填进输入框，用户可以直接改。 */
function parseLegacySet(a) {
  var w = parseFloat(String(a.wt).replace(/[^0-9.]/g, ''));
  if (!isFinite(w)) w = 0;
  var reps = String(a.rep).split(/[·、,，/]/).map(function (x) { return parseInt(x, 10); })
    .filter(function (x) { return isFinite(x) && x > 0; });
  return { w: w, reps: reps.length ? reps : [0] };
}

/** 把任一会话（新格式或历史存档）统一成 entries 视图。
 *  历史存档的 actual 里只有动作编号 n，需要用当日的计划表解析出动作名。 */
function sessionEntries(S) {
  if (!S) return [];
  if (S.entries) return S.entries;
  var P = (typeof getPlan === 'function') ? getPlan(S.planType) : null;
  return (S.actual || []).map(function (a) {
    var pe = P ? P.ex.filter(function (x) { return x.n === a.n; })[0] : null;
    return { n: a.n, name: pe ? pe.name : ('动作' + a.n), rawW: a.wt, rawR: a.rep, legacy: true };
  });
}

/** 找某动作在 beforeKey 之前最近一次的记录，用于显示「上次」并预填 */
function lastSessionFor(name, beforeKey) {
  var all = allSessions();
  var keys = Object.keys(all).filter(function (k) { return k < beforeKey; }).sort();
  for (var i = keys.length - 1; i >= 0; i--) {
    var s = all[keys[i]];
    var ents = sessionEntries(s);
    for (var j = 0; j < ents.length; j++) {
      var e = ents[j];
      if (e.name !== name) continue;
      var sets = null;
      if (e.sets && e.sets.length) sets = e.sets.map(function (x) { return { w: x.w, r: x.r }; });
      else if (e.legacy || e.rawW) { var p = parseLegacySet({ wt: e.rawW || '', rep: e.rawR || '' }); sets = p.reps.map(function (r) { return { w: p.w, r: r }; }); }
      if (sets && sets.length) return { date: keys[i], sets: sets, legacy: !e.sets };
    }
  }
  return null;
}

/** 某天的记录是否是新录入的（可编辑），还是历史存档（只读） */
function isEditable(dsKey) { return !!store.sessions[dsKey]; }

/* ══════════════════════════════════════════════════════════════════
 * 训练中枢 · 后端同步层
 * ------------------------------------------------------------------
 * ⚠️ 这是**唯一**直接接触后端的文件。
 *    app.js 只知道「当前用户是谁」和「现在同不同步」，不知道背后是谁。
 *    将来迁到 Cloudflare / 国内云，只改本文件 + config.js。
 *
 * 设计要点：
 *   1. 本地优先 —— 后端连不上时 App 照常能用，数据先落本机
 *   2. 增量拉取 —— 用服务端 synced_at 做水位线，客户端时钟不准也不漏
 *   3. 先拉后推 —— 合并（同 key 取 updated_at 较新者）后只推脏数据
 *   4. 全程 try/catch —— 任何网络错误都不能让页面崩
 * ══════════════════════════════════════════════════════════════════ */

var PLAN_ROW_DATE = '1970-01-01';   // 计划不是按日期的，用哨兵日期占位

var _fetch = (typeof fetch === 'function') ? fetch.bind(typeof window !== 'undefined' ? window : globalThis) : null;

var _syncMem = {};
var _syncLs = (typeof localStorage !== 'undefined' && localStorage) ? localStorage : {
  getItem: function (k) { return Object.prototype.hasOwnProperty.call(_syncMem, k) ? _syncMem[k] : null; },
  setItem: function (k, v) { _syncMem[k] = String(v); },
  removeItem: function (k) { delete _syncMem[k]; }
};

// ── 状态 ──────────────────────────────────────────────────────────

var auth = { user: null, token: null, refresh: null, exp: 0 };
var syncState = { lastPulledAt: null, dirty: {} };
var syncStatus = 'idle';   // idle | syncing | ok | error | offline | noauth
var syncError = '';
var syncLastAt = null;

function authRestore() {
  try {
    var o = JSON.parse(_syncLs.getItem(LS_AUTH) || 'null');
    if (o && o.token) auth = o;
  } catch (e) { /* 忽略 */ }
  try {
    var s = JSON.parse(_syncLs.getItem(LS_SYNC) || 'null');
    if (s) { syncState.lastPulledAt = s.lastPulledAt || null; syncState.dirty = s.dirty || {}; }
  } catch (e) { /* 忽略 */ }
}
function authPersist() {
  try { _syncLs.setItem(LS_AUTH, JSON.stringify(auth)); } catch (e) { /* 忽略 */ }
}
function authClear() {
  auth = { user: null, token: null, refresh: null, exp: 0 };
  try { _syncLs.removeItem(LS_AUTH); } catch (e) { /* 忽略 */ }
}
function syncPersist() {
  try { _syncLs.setItem(LS_SYNC, JSON.stringify(syncState)); } catch (e) { /* 忽略 */ }
}
function isLoggedIn() { return !!(auth.user && auth.token); }
function markDirty(kind, date) { syncState.dirty[kind + ':' + date] = 1; syncPersist(); }

// ── HTTP 封装 ─────────────────────────────────────────────────────

async function sbFetch(path, opts) {
  opts = opts || {};
  if (!_fetch) throw new Error('当前环境不支持网络请求');
  var headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Content-Type': 'application/json'
  };
  if (opts.auth !== false && auth.token) headers['Authorization'] = 'Bearer ' + auth.token;
  else headers['Authorization'] = 'Bearer ' + SUPABASE_ANON_KEY;
  if (opts.headers) Object.keys(opts.headers).forEach(function (k) { headers[k] = opts.headers[k]; });

  var res = await _fetch(SUPABASE_URL + path, {
    method: opts.method || 'GET',
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  var text = await res.text();
  var json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
  if (!res.ok) {
    var msg = (json && (json.msg || json.message || json.error_description || json.error)) || text || ('HTTP ' + res.status);
    var err = new Error(String(msg).slice(0, 300));
    err.status = res.status;
    throw err;
  }
  return { json: json, headers: res.headers };
}

// ── 认证 ──────────────────────────────────────────────────────────

async function sbSignUp(email, password) {
  var r = await sbFetch('/auth/v1/signup', { method: 'POST', auth: false, body: { email: email, password: password } });
  // 若项目开启了邮箱确认，这里拿不到 token，只能算「注册成功待确认」
  if (r.json && r.json.access_token) { adoptSession(r.json); return { ok: true, needConfirm: false }; }
  return { ok: true, needConfirm: true };
}

async function sbSignIn(email, password) {
  var r = await sbFetch('/auth/v1/token?grant_type=password', { method: 'POST', auth: false, body: { email: email, password: password } });
  adoptSession(r.json);
  return { ok: true };
}

async function sbRefresh() {
  if (!auth.refresh) throw new Error('没有刷新令牌');
  var r = await sbFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', auth: false, body: { refresh_token: auth.refresh } });
  adoptSession(r.json);
}

function adoptSession(j) {
  if (!j || !j.access_token) throw new Error('登录响应里没有 access_token');
  auth.token = j.access_token;
  auth.refresh = j.refresh_token || auth.refresh;
  auth.user = j.user || auth.user;
  auth.exp = j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600));
  authPersist();
}

async function sbSignOut() {
  try { await sbFetch('/auth/v1/logout', { method: 'POST' }); } catch (e) { /* 本地照样清 */ }
  authClear();
  syncStatus = 'noauth';
}

async function ensureFreshToken() {
  if (!auth.token) return false;
  if (auth.exp && (auth.exp * 1000 - Date.now()) < 120000) {
    try { await sbRefresh(); } catch (e) { authClear(); return false; }
  }
  return true;
}

// ── 本地 ⇄ 远端 数据映射 ──────────────────────────────────────────

/** 把本地 store 摊平成服务端的行格式 */
function localRecords() {
  var out = [];
  var groups = [['session', store.sessions], ['measure', store.measures], ['tcm', store.tcm], ['adj', store.adj]];
  groups.forEach(function (g) {
    var kind = g[0], obj = g[1] || {};
    Object.keys(obj).forEach(function (date) {
      var v = obj[date];
      if (v && v.draft) return;        // 草稿不上传
      out.push({
        kind: kind,
        date: date,
        data: v,
        updated_at: (v && v.updatedAt) || new Date().toISOString(),
        deleted_at: (v && v.deletedAt) || null
      });
    });
  });
  // 训练计划：整份存在一条记录里（不是按日期），用哨兵日期
  if (store.plans && store.plans.days && Object.keys(store.plans.days).length) {
    out.push({
      kind: 'plan', date: PLAN_ROW_DATE, data: store.plans,
      updated_at: store.plans.updatedAt || new Date().toISOString(), deleted_at: null
    });
  }
  return out;
}

/** 把服务端返回的行写回本地 store */
function applyRemote(rows) {
  (rows || []).forEach(function (row) {
    // 计划是整份替换，不按日期合并
    if (row.kind === 'plan') {
      var lAt = (store.plans && store.plans.updatedAt) ? Date.parse(store.plans.updatedAt) : 0;
      var rAt = row.updated_at ? Date.parse(row.updated_at) : 0;
      if (row.deleted_at) { if (lAt <= rAt) store.plans = { types: null, days: {}, updatedAt: null }; return; }
      if (rAt >= lAt) store.plans = row.data;
      return;
    }
    var bucket = row.kind === 'session' ? store.sessions
               : row.kind === 'measure' ? store.measures
               : row.kind === 'tcm'     ? store.tcm
               : row.kind === 'adj'     ? store.adj
               : null;
    if (!bucket) return;
    var local = bucket[row.date];
    var localAt = local && local.updatedAt ? Date.parse(local.updatedAt) : 0;
    var remoteAt = row.updated_at ? Date.parse(row.updated_at) : 0;

    if (row.deleted_at) {
      // 远端已删除：本地没有更新的改动就跟着删
      if (!local || localAt <= remoteAt) delete bucket[row.date];
      return;
    }
    // 后写胜：远端更新才覆盖
    if (!local || remoteAt >= localAt) bucket[row.date] = row.data;
  });
}

// ── 同步主流程 ────────────────────────────────────────────────────

async function syncNow(opts) {
  opts = opts || {};
  if (!isLoggedIn()) { syncStatus = 'noauth'; return { ok: false, reason: 'noauth' }; }
  if (syncStatus === 'syncing') return { ok: false, reason: 'busy' };
  if (!_fetch) { syncStatus = 'error'; syncError = '环境不支持网络'; return { ok: false, reason: 'nofetch' }; }

  syncStatus = 'syncing'; syncError = '';
  if (typeof refreshSyncUI === 'function') refreshSyncUI();

  try {
    if (!(await ensureFreshToken())) { syncStatus = 'noauth'; if (typeof refreshSyncUI === 'function') refreshSyncUI(); return { ok: false, reason: 'noauth' }; }

    // ① 先拉：只取服务端 synced_at 水位线之后变化的行
    var pulled = 0;
    if (syncState.lastPulledAt) {
      var q = '/rest/v1/records?select=*&synced_at=gt.' + encodeURIComponent(syncState.lastPulledAt) + '&order=synced_at.asc&limit=2000';
      var r = await sbFetch(q);
      var rows = r.json || [];
      if (rows.length) { applyRemote(rows); pulled = rows.length; }
      var maxSynced = rows.reduce(function (a, x) { return (x.synced_at && x.synced_at > a) ? x.synced_at : a; }, syncState.lastPulledAt);
      var serverDate = r.headers && r.headers.get ? r.headers.get('date') : null;
      syncState.lastPulledAt = maxSynced || (serverDate ? new Date(serverDate).toISOString() : new Date().toISOString());
    } else {
      // 首次：全量
      var r0 = await sbFetch('/rest/v1/records?select=*&order=synced_at.asc&limit=5000');
      var rows0 = r0.json || [];
      if (rows0.length) { applyRemote(rows0); pulled = rows0.length; }
      var serverDate0 = r0.headers && r0.headers.get ? r0.headers.get('date') : null;
      syncState.lastPulledAt = rows0.length
        ? rows0.reduce(function (a, x) { return (x.synced_at && x.synced_at > a) ? x.synced_at : a; }, '')
        : (serverDate0 ? new Date(serverDate0).toISOString() : new Date().toISOString());
    }

    // ② 后推：合并完成后再上传，避免旧数据覆盖新数据
    var all = localRecords();
    var dirtyKeys = Object.keys(syncState.dirty);
    var toPush = dirtyKeys.length
      ? all.filter(function (rec) { return syncState.dirty[rec.kind + ':' + rec.date]; })
      : [];

    if (toPush.length) {
      var payload = toPush.map(function (rec) {
        return { user_id: auth.user.id, kind: rec.kind, date: rec.date, data: rec.data,
                 updated_at: rec.updated_at, deleted_at: rec.deleted_at };
      });
      await sbFetch('/rest/v1/records?on_conflict=user_id,kind,date', {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
        body: payload
      });
      syncState.dirty = {};
    }

    syncPersist();
    saveStore();
    syncStatus = 'ok'; syncLastAt = new Date().toISOString();
    if (typeof refreshSyncUI === 'function') refreshSyncUI();
    if (typeof renderCalendar === 'function') renderCalendar();
    return { ok: true, pulled: pulled, pushed: toPush.length };
  } catch (e) {
    var msg = (e && e.message) ? e.message : String(e);
    syncError = msg;
    syncStatus = /Failed to fetch|NetworkError|Load failed|network/i.test(msg) ? 'offline' : 'error';
    if (typeof refreshSyncUI === 'function') refreshSyncUI();
    return { ok: false, reason: 'error', message: msg };
  }
}

/* ── 一次性迁移：把源码里的历史存档搬进可同步的本地库 ──────────
 * 关键：**照搬，不改写**。
 *   LOGS 的汇总格式（actual:[{n, wt:'80kg', rep:'8·7·8'}]）原样存进 store，
 *   因为 sessionEntries() 已经能解析新旧两种形态，改写成逐组反而是有损的
 *   （'助力9格' / '10→15kg/侧' 这类没法无损转成数字）。
 *
 * 迁移后这些数据就和其他记录一样会被推到云端，源码里的存档成为冗余。
 */
function migrateLegacy() {
  var FLAG = 'zx.migrated.v1';
  try { if (_syncLs.getItem(FLAG)) return 0; } catch (e) { /* 忽略 */ }
  var n = 0, now = new Date().toISOString();

  Object.keys(LOGS || {}).forEach(function (d) {
    if (store.sessions[d]) return;
    var L = LOGS[d], copy = {};
    Object.keys(L).forEach(function (k) { copy[k] = L[k]; });
    copy.updatedAt = now;
    store.sessions[d] = copy;
    markDirty('session', d); n++;
  });

  Object.keys(TCM_LOG || {}).forEach(function (d) {
    if (store.tcm[d]) return;
    var t = TCM_LOG[d], copy = {};
    Object.keys(t).forEach(function (k) { copy[k] = t[k]; });
    copy.updatedAt = now;
    store.tcm[d] = copy;
    markDirty('tcm', d); n++;
  });

  Object.keys(ADJ || {}).forEach(function (d) {
    if (store.adj[d]) return;
    var a = ADJ[d];
    store.adj[d] = { notes: (a.notes || []).slice(), updatedAt: now };
    markDirty('adj', d); n++;
  });

  if (n) saveStore();
  try { _syncLs.setItem(FLAG, '1'); } catch (e) { /* 忽略 */ }
  return n;
}

var legacyMigrated = migrateLegacy();

authRestore();
if (!isLoggedIn()) syncStatus = 'noauth';

/* ══════════════════════════════════════════════════════════════════
 * 训练中枢 · 训练模式（FR-16 休息计时器 / FR-17 流程引导 / 组标记）
 * ------------------------------------------------------------------
 * 和「记录训练」（showRec）的区别：
 *   showRec      编辑模式 —— 一屏看全部动作，用于事后补记、修改、回看
 *   训练模式      引导模式 —— 一次只看当前动作，做完一组点完成、自动计时
 *
 * 三个设计决定值得说明：
 *   1. 倒计时用「结束时间戳」而不是递减计数器
 *      手机锁屏 / 切后台时浏览器会把 setInterval 节流到 1 次/秒甚至暂停，
 *      递减计数会越走越慢；按时间戳算则永远准确。
 *   2. 计时状态写进 localStorage，刷新页面 / 误关也能接着走
 *   3. 自动申请 Wake Lock 保持屏幕常亮 —— 健身房低头看表时屏幕别黑
 * ══════════════════════════════════════════════════════════════════ */

var woCur = 0;                       // 当前动作下标
var woKey = null;                    // 当前训练日期
var woTimer = { endsAt: 0, total: 0, label: '' };
var _woTick = null;
var _woWake = null;

var LS_WO = 'zx.workout.v1';

/* ── 休息时长解析：把 PLAN 里的 '3min' / '2.5min' / '40s' / '—' 变成秒 ── */
function parseRest(str) {
  var s = String(str || '');
  var m = s.match(/([\d.]+)\s*min/i);
  if (m) return Math.round(parseFloat(m[1]) * 60);
  m = s.match(/([\d.]+)\s*s(ec)?/i);
  if (m) return Math.round(parseFloat(m[1]));
  return 90;                          // 兜底 90 秒
}

/* ── 计时器持久化 ── */
function woTimerSave() {
  try { _ls.setItem(LS_WO, JSON.stringify(woTimer)); } catch (e) {}
}
function woTimerLoad() {
  try {
    var o = JSON.parse(_ls.getItem(LS_WO) || 'null');
    if (o && o.endsAt) woTimer = o;
  } catch (e) {}
}
function woTimerActive() { return woTimer.endsAt > Date.now(); }
function woTimerLeft() { return Math.max(0, Math.ceil((woTimer.endsAt - Date.now()) / 1000)); }
function woFmt(sec) {
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

/* ── 提示音 + 震动 ──────────────────────────────────────────────
 * iOS 的两个限制必须绕开：
 *   1. AudioContext 不允许在「非用户手势」的上下文里启动 ——
 *      如果等到计时结束（几分钟后）才 new，iOS 会把它挂在 suspended，一声不出。
 *      所以要在用户点「开始训练」或「完成」的那一刻就解锁，之后复用同一个上下文。
 *   2. navigator.vibrate 在 iOS 上不存在（Safari 从未支持），震动只能用于安卓。
 *      所以 iPhone 上「休息结束」的反馈完全依赖声音 + 视觉闪烁。
 */
var _woAudio = null;

/** 必须在用户手势（onclick）里调用 */
function woAudioUnlock() {
  try {
    var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return null;
    if (!_woAudio) _woAudio = new AC();
    if (_woAudio.state === 'suspended' && _woAudio.resume) _woAudio.resume();
    // 播一个听不见的极短音，把上下文彻底激活
    var o = _woAudio.createOscillator(), g = _woAudio.createGain();
    g.gain.value = 0.0001;
    o.connect(g); g.connect(_woAudio.destination);
    o.start(); o.stop(_woAudio.currentTime + 0.02);
    return _woAudio;
  } catch (e) { return null; }
}

/* 可选提示音 —— 用 Web Audio 现场合成，不需要任何音频文件 */
var WO_SOUNDS = {
  ding:     { name: '叮',   desc: '单声，清脆（默认）', tones: [{ f: 880,  off: 0,    d: 0.30, type: 'sine' }] },
  dingdong: { name: '叮咚', desc: '两声，下行，柔和',   tones: [{ f: 988, off: 0,    d: 0.20, type: 'sine' },
                                                             { f: 740, off: 0.20, d: 0.40, type: 'sine' }] },
  beep:     { name: '哔哔', desc: '方波，尖锐，嘈杂环境更易听见', tones: [{ f: 1200, off: 0,    d: 0.13, type: 'square' },
                                                                       { f: 1200, off: 0.20, d: 0.13, type: 'square' }] },
  chime:    { name: '长鸣', desc: '一声长音，最不容易漏',  tones: [{ f: 660,  off: 0,    d: 1.20, type: 'triangle' }] },
  none:     { name: '静音', desc: '只闪屏不发声',         tones: [] }
};
var LS_SOUND = 'zx.sound.v1';

function woSoundGet() {
  var v = null;
  try { v = _ls.getItem(LS_SOUND); } catch (e) {}
  return (v && WO_SOUNDS[v]) ? v : 'ding';
}
function woSoundSet(id) {
  if (!WO_SOUNDS[id]) return;
  try { _ls.setItem(LS_SOUND, id); } catch (e) {}
}

/** 播放指定提示音，repeat 次（每次之间间隔 0.35 秒） */
function woPlay(id, repeat) {
  var snd = WO_SOUNDS[id || woSoundGet()] || WO_SOUNDS.ding;
  if (!snd.tones.length) return;
  var ctx = _woAudio || woAudioUnlock();
  if (!ctx) return;
  try {
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    for (var r = 0; r < (repeat || 1); r++) {
      for (var i = 0; i < snd.tones.length; i++) {
        var t = snd.tones[i];
        var t0 = ctx.currentTime + r * 0.35 + t.off;
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = t.type;
        o.frequency.setValueAtTime(t.f, t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + t.d);
        o.start(t0); o.stop(t0 + t.d + 0.02);
      }
    }
  } catch (e) { /* 忽略 */ }
}

/** 到点提示：声音 + 震动（震动仅安卓有效） */
function woBeep(times) {
  woPlay(woSoundGet(), times || 1);
  try { if (navigator.vibrate) navigator.vibrate([240, 100, 240, 100, 240]); } catch (e) {}
}

/** 5 秒测试计时 —— 不用真的等 3 分钟就能验证「计时结束 → 响铃 + 闪烁」整条路径 */
function woTestTimer() {
  woAudioUnlock();
  woTimerStart(5, '测试');
}

/** 手动试听 —— 让你在训练前确认声音真的会响 */
/* ── 系统通知 ──────────────────────────────────────────────────
 * 能做：到点时如果页面还活着，弹一条系统通知（看别的 App 也能看到）
 * 做不到：iOS 在页面被挂起后不再执行任何 JS ——
 *         锁屏 / 切走超过约 30 秒后，到点不会有任何回调，
 *         因此也就没有通知可发。真正「锁屏也能响」需要
 *         服务器端在精确时刻主动推送，见 PRD 的说明。
 */
function woNotifyPerm() {
  try {
    if (typeof Notification === 'undefined') return 'unsupported';
    return Notification.permission;
  } catch (e) { return 'unsupported'; }
}

function woNotifyAsk() {
  try {
    if (typeof Notification === 'undefined') return Promise.resolve(false);
    if (Notification.permission === 'granted') return Promise.resolve(true);
    if (Notification.permission === 'denied') return Promise.resolve(false);
    return Notification.requestPermission().then(function (r) { return r === 'granted'; });
  } catch (e) { return Promise.resolve(false); }
}

function woNotify(title, body) {
  try {
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    var opts = { body: body, tag: 'zx-rest', renotify: true, icon: 'icon-192.png', badge: 'icon-192.png' };
    // iOS 只认 Service Worker 发出的通知，new Notification() 无效
    if (typeof navigator !== 'undefined' && navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready.then(function (reg) {
        try { reg.showNotification(title, opts); }
        catch (e) { try { new Notification(title, opts); } catch (e2) {} }
      }).catch(function () { try { new Notification(title, opts); } catch (e) {} });
    } else {
      new Notification(title, opts);
    }
  } catch (e) { /* 忽略 */ }
}

function showSoundPicker() {
  var cur = woSoundGet();

      + '<button class="btn-xs" onclick="event.stopPropagation();woAudioUnlock();woPlay(\'' + id + '\',1)">试听</button>'

    + '到点不会有提示 —— 这是浏览器层面的限制，不是 App 的问题。</div>';

function woSoundPick(id) {

function woTestSound() {
