<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>训练中枢</title>
<style>
/* ═══════ RESET & BASE ═══════ */
:root{--bg:#060608;--c1:#0c0d10;--c2:#111318;--b:#1c1d24;--t:#c8c8cc;--d:#5a5a60;--gl:#c89640;--rd:#e05040;--gn:#50a060;--bl:#5090c0;--cy:#40b8b0;--pp:#9060b8;--br:8px;--sh:0 2px 8px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.5;min-height:100vh}
a{color:var(--pp);text-decoration:none}

/* ═══════ LAYOUT ═══════ */
.app{display:flex;max-width:1100px;margin:0 auto;min-height:100vh}
.sidebar{width:260px;flex-shrink:0;background:var(--c2);border-right:1px solid var(--b);padding:12px;display:flex;flex-direction:column;gap:10px}
.main{flex:1;padding:12px 16px;overflow-y:auto;max-height:100vh}

/* ═══════ HEADER ═══════ */
.app-title{font-size:1rem;font-weight:700;color:var(--t);padding:8px 12px;text-align:center;background:linear-gradient(135deg,#0a0c14,#060810);border-radius:var(--br);border:1px solid var(--b)}
.app-title span{color:var(--gl)}

/* ═══════ CALENDAR ═══════ */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.cal-nav button{background:none;border:none;color:var(--t);cursor:pointer;font-size:.9rem;padding:2px 8px;border-radius:4px}
.cal-nav button:hover{background:var(--c1)}
.cal-nav .month-label{font-weight:700;font-size:.85rem}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.6rem;color:var(--d);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center}
.cal-grid .cell{padding:6px 2px;border-radius:4px;cursor:pointer;position:relative;font-size:.72rem;min-height:32px;transition:background .15s}
.cal-grid .cell:hover{background:var(--c1)}
.cal-grid .cell.today{background:var(--c1);font-weight:700;color:var(--gl)}
.cal-grid .cell .n{display:block}
.cal-grid .cell .dot{width:5px;height:5px;border-radius:50%;background:var(--gn);position:absolute;bottom:3px;left:50%;transform:translateX(-50%)}
.cal-grid .cell .tag{font-size:.5rem;color:var(--d);margin-top:2px;display:block;line-height:1}

/* ═══════ PANELS ═══════ */
.ov-header{display:flex;align-items:flex-start;justify-content:space-between;padding:12px 16px;background:var(--c2);border-radius:var(--br) var(--br) 0 0;border:1px solid var(--b);border-bottom:none}
.ov-header .title{font-size:.95rem;font-weight:700}
.ov-header .sub{font-size:.7rem;color:var(--d)}
.ov-header .close-btn{background:none;border:none;color:var(--d);cursor:pointer;font-size:1.1rem}
.ov-header .close-btn:hover{color:var(--rd)}
.ov-body{border:1px solid var(--b);border-top:none;border-radius:0 0 var(--br) var(--br);padding:0}
.ov-body .layer{border-bottom:1px solid var(--b)}
.ov-body .layer:last-child{border-bottom:none}
.layer-h{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--t);user-select:none}
.layer-h:hover{background:var(--c1)}
.layer-h .icon{font-size:.85rem}
.layer-h .arrow{font-size:.6rem;color:var(--d);transition:transform .2s;margin-left:auto}
.layer.collapsed .layer-b{display:none}
.layer.collapsed .arrow{transform:rotate(-90deg)}
.layer-b{padding:8px 16px 12px;font-size:.75rem;color:var(--d);line-height:1.7}

/* ═══════ EXERCISE ROW ═══════ */
.ex-row{border-top:1px solid var(--b);cursor:pointer}
.ex-row:first-child{border-top:none}
.ex-sum{padding:6px 12px;font-size:.73rem;white-space:nowrap;overflow:hidden}
.ex-sum .ex-n{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--c1);text-align:center;line-height:18px;font-size:.6rem;font-weight:700;color:var(--t);vertical-align:middle;margin-right:6px}
.ex-sum .ex-name{font-weight:600;color:var(--t);vertical-align:middle;margin-right:8px}
.ex-sum .ex-tag{display:inline-block;padding:1px 5px;background:var(--c1);border-radius:3px;font-size:.6rem;color:var(--d);vertical-align:middle;margin-right:4px}
.ex-detail{display:none;padding:0 16px 12px 44px;font-size:.7rem;color:var(--d);line-height:1.7}
.ex-row.open .ex-detail{display:block}
.ex-detail b{color:var(--t)}
.ex-detail .dt-sect{margin-top:6px}
.ex-detail .dt-sect .dt-label{color:var(--gl);font-weight:600;font-size:.68rem;margin-bottom:2px}

/* ═══════ TEA / FORMULA ═══════ */
.tea-base{font-size:.78rem;color:var(--t);padding:6px 0}
.tea-adj{font-size:.75rem;color:var(--rd);font-weight:600;padding:4px 0}
.tea-special{font-size:.68rem;color:var(--d)}
.tea-note{font-size:.66rem;color:var(--pp);padding:2px 0}
.tea-note.warn{color:var(--rd)}

/* ═══════ LOG TABLE ═══════ */
.log-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 16px;font-size:.7rem}
.log-summary .log-item{background:var(--c1);padding:8px 10px;border-radius:var(--br)}
.log-summary .log-item .log-k{color:var(--d);font-size:.62rem}
.log-summary .log-item .log-v{color:var(--t);font-weight:600;margin-top:2px}
.log-actual{padding:8px 16px}
.log-actual .la-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.7rem;border-bottom:1px solid var(--b)}
.log-actual .la-row .la-n{width:18px;text-align:center;font-weight:700;color:var(--d)}
.log-actual .la-row .la-name{flex:1;color:var(--t)}
.log-actual .la-row .la-data{color:var(--d);text-align:right}

/* ═══════ NUTRITION ═══════ */
.meal-row{padding:6px 0;font-size:.72rem;border-bottom:1px solid var(--b)}
.meal-row:last-child{border-bottom:none}
.meal-row .meal-name{font-weight:600;color:var(--t)}
.meal-row .meal-items{color:var(--d);font-size:.68rem}
.meal-row .meal-macros{color:var(--gl);font-size:.65rem}

/* ═══════ RECOVERY ═══════ */
.rec-item{display:flex;gap:8px;padding:4px 0;font-size:.72rem}
.rec-item .rec-act{color:var(--t);flex:1}
.rec-item .rec-dur{color:var(--d);font-size:.68rem}

/* ═══════ EMPTY STATE ═══════ */
.empty{text-align:center;padding:30px;color:var(--d);font-size:.78rem}

/* ═══════ BUTTONS ═══════ */
.btn-sm{font-size:.65rem;padding:4px 10px;border:1px solid var(--b);background:var(--c1);color:var(--t);border-radius:4px;cursor:pointer}
.btn-sm:hover{background:var(--b)}
.btn-accent{background:var(--pp);color:#fff;border:none;padding:6px 14px;border-radius:var(--br);font-size:.7rem;cursor:pointer;font-weight:600}
.btn-accent:hover{opacity:.85}

/* ═══════ TCM LOG ═══════ */
.tcm-card{background:var(--c1);border-radius:var(--br);padding:10px 12px;margin:6px 0}
.tcm-card .tcm-row{font-size:.7rem;padding:3px 0}
.tcm-card .tcm-row .tcm-k{color:var(--d)}
.tcm-card .tcm-row .tcm-v{color:var(--t)}

/* ═══════ MOBILE ═══════ */
@media(max-width:768px){
  .app{display:block;max-width:100%}
  .sidebar{width:100%;max-height:none;overflow:visible;border-right:none;border-bottom:2px solid var(--b);padding:8px 10px;gap:4px;position:static}
  .main{max-height:none;padding:8px 4px;width:100%}
  .app-title{padding:6px 10px;font-size:.9rem}
  .cal-nav button{font-size:.8rem;padding:2px 6px}
  .cal-nav .month-label{font-size:.8rem}
  .cal-dow{font-size:.55rem}
  .cal-grid .cell{padding:5px 1px;min-height:26px;font-size:.68rem}
  .cal-grid .cell .tag{font-size:.45rem}
  .ex-row .ex-sum{font-size:.68rem;padding:5px 8px}
  .ex-sum .ex-n{width:16px;height:16px;line-height:16px;font-size:.55rem;margin-right:4px}
  .ex-sum .ex-name{font-size:.65rem;margin-right:4px}
  .ex-sum .ex-tag{font-size:.55rem;padding:1px 3px;margin-right:2px}
  .ov-header{padding:8px 10px;border-radius:0}
  .ov-header .title{font-size:.82rem}
  .ov-header .sub{font-size:.65rem}
  .ov-body{border-radius:0}
  .layer-h{padding:7px 10px;font-size:.7rem}
  .layer-b{padding:6px 10px 10px;font-size:.68rem}
  .log-summary{grid-template-columns:1fr}
  .meal-row{font-size:.68rem}
}
</style>
</head>

  let h='';
  if(d.wt_r)h+='<div class="dt-sect"><span class="dt-label">wt-r</span> '+d.wt_r+'</div>';
  if(d.phase)h+='<div class="dt-sect"><span class="dt-label">phase</span> '+d.phase+'</div>';
  if(d.bre)h+='<div class="dt-sect"><span class="dt-label">bre</span> '+d.bre+'</div>';
  if(d.mm)h+='<div class="dt-sect"><span class="dt-label">mm</span> '+d.mm+'</div>';
  if(d.err_sm)h+='<div class="dt-sect"><span class="dt-label">err-sm</span> '+d.err_sm+'</div>';
  if(d.alt_sm)h+='<div class="dt-sect"><span class="dt-label">alt-sm</span> '+d.alt_sm+'</div>';
  return h;
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ── CALENDAR ──
let calY=(new Date()).getFullYear(),calM=(new Date()).getMonth();
function renderCalendar(){
  const today=new Date();const ts=ds(today);
  const first=new Date(calY,calM,1);const startDow=first.getDay();
  const days=new Date(calY,calM+1,0).getDate();
  let h='<div class="cal-nav">';
  h+='<button onclick="navCal(-1)">◀</button>';
  h+='<span class="month-label">'+(calM+1)+'月 '+calY+'</span>';
  h+='<button onclick="navCal(1)">▶</button>';
  h+='</div><div class="cal-dow">';
  ['日','一','二','三','四','五','六'].forEach(d=>h+='<div>'+d+'</div>');
  h+='</div><div class="cal-grid">';
  for(let i=0;i<startDow;i++)h+='<div class="cell"></div>';
  for(let d=1;d<=days;d++){
    const dsKey=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const date=new Date(calY,calM,d);const day=date.getDay();
    const cls=['cell'];if(dsKey===ts)cls.push('today');
    const typeKey=TYPES[day];
    h+='<div class="'+cls.join(' ')+'" onclick="openDay(\''+dsKey+'\')">';
    h+='<span class="n">'+d+'</span>';
    if(LOGS[dsKey])h+='<span class="dot"></span>';
    h+='<span class="tag">'+typeKey+'</span>';
    h+='</div>';
  }
  h+='</div>';
  document.getElementById('calContainer').innerHTML=h;
  document.getElementById('todayLabel').textContent='今天 '+ts;
}
function navCal(dir){calM+=dir;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}renderCalendar()}

// ── MAIN VIEW ──
function openDay(dsKey){
  const ptype=getPlanType(new Date(dsKey));
  if(LOGS[dsKey]){showLog(dsKey,ptype);return}
  if(ptype==='休'||ptype==='休日'){showRestDay(dsKey,ptype);return}
  showPlan(dsKey,ptype);
}

function showPlan(dsKey,ptype){
  const P=PLAN[ptype];if(!P)return;
  const adj=ADJ[dsKey];
  let h=ovHeader(dsKey,P.day+' · '+P.total,adj?'已叠加调整':'');
  h+='<div class="ov-body">';
  if(adj){h+='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">⚠️</span>今日调整提醒<span class="arrow">▼</span></div><div class="layer-b">';
    adj.notes.forEach(function(n){
      const parts=n.split('|');
      if(parts.length>=3){
        h+='<div style="white-space:nowrap;padding:3px 0;font-size:.73rem">';
        h+='<span style="font-weight:700;color:var(--t)">'+parts[0]+'</span>';
        for(let i=1;i<parts.length;i++){
          h+=' <span class="ex-tag">'+parts[i]+'</span>';
        }
        h+='</div>';
      }else{
        h+='<div style="padding:2px 0;white-space:nowrap;font-size:.7rem">'+n+'</div>';
      }
    });
    h+='</div></div>';}
  h+='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">📋</span>训练计划 · '+P.total+'<span class="arrow">▼</span></div><div class="layer-b">';
  h+='<div style="font-size:.65em;color:var(--d);margin-bottom:4px">目标肌群：'+[...new Set(P.ex.map(e=>e.mus))].join(' · ')+'</div>';
  P.ex.forEach(e=>{
    h+='<div class="ex-row" onclick="this.classList.toggle(\'open\')"><div class="ex-sum"><span class="ex-n">'+e.n+'</span><span class="ex-name">'+e.name+'</span><span class="ex-tag">'+e.wt+'</span><span class="ex-tag">'+e.sr+'</span><span class="ex-tag">'+e.rest+'</span><span class="ex-tag">'+e.rir+'</span></div><div class="ex-detail">'+dt(e.name)+'</div></div>';
  });
  h+='</div></div>';
  h+=teaSection(ptype,dsKey);
  h+=recSection(ptype);
  h+=nutSection(ptype);
  h+=ovFooter();
  h+='</div>';
  renderMain(h);
}

function showRestDay(dsKey,ptype){
  const d=new Date(dsKey);const isSun=d.getDay()===0;
  const tl=TCM_LOG[dsKey];
  let h=ovHeader(dsKey,isSun?'周日 · 完全休息':'周三 · 休息日',isSun?'白开水·脾胃休息':'茶饮调理·主动休息');
  h+='<div class="ov-body">';
  if(tl){
    h+='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">👅</span>今日舌诊与体质追踪<span class="arrow">▼</span></div><div class="layer-b">';
    h+='<div class="tcm-card"><div class="tcm-row"><span class="tcm-k">👅 舌象</span> <span class="tcm-v">'+tl.tongue+'</span></div>';
    h+='<div class="tcm-row"><span class="tcm-k">📊 趋势</span> <span class="tcm-v">'+tl.trend+'</span></div>';
    h+='<div class="tcm-row"><span class="tcm-k">🔬 诊断</span> <span class="tcm-v">'+tl.diagnosis+'</span></div></div>';
    h+='<div class="tea-adj">⚡ 今日调整：'+tl.tea_extra+'</div>';
    tl.watch.forEach(w=>h+='<div class="tea-note warn">⚠️ '+w+'</div>');
    h+='</div></div>';
  }
  h+=teaSection(isSun?'休日':'休',dsKey);
  h+=nutSection(ptype);
  h+=ovFooter();
  h+='</div>';
  renderMain(h);
}

function showLog(dsKey,ptype){
  const L=LOGS[dsKey];if(!L)return;
  const P=PLAN[L.planType];if(!P)return;
  const adj=ADJ[L.summary.next];
  let h=ovHeader(dsKey,'📝 训练实录 · '+L.planType,L.summary.done);
  h+='<div class="ov-body">';
  h+='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">📊</span>训练记录<span class="arrow">▼</span></div><div class="layer-b">';
  h+='<div class="log-summary"><div class="log-item"><div class="log-k">✅ 完成率</div><div class="log-v">'+L.summary.done+'</div></div>';
  h+='<div class="log-item"><div class="log-k">👍 本日亮点</div><div class="log-v" style="color:var(--gn)">'+L.summary.good+'</div></div>';
  h+='<div class="log-item"><div class="log-k">⚠️ 问题</div><div class="log-v" style="color:var(--rd)">'+L.summary.bad+'</div></div>';
  h+='<div class="log-item"><div class="log-k">🔧 下次调整</div><div class="log-v" style="color:var(--gl)">'+L.summary.adj+'</div></div></div>';
  if(L.actual){
    h+='<div class="log-actual">';
    L.actual.forEach(a=>{
      const pEx=P.ex.find(e=>e.n===a.n);const name=pEx?pEx.name:'动作'+a.n;
      h+='<div class="la-row"><span class="la-n">'+a.n+'</span><span class="la-name">'+name+'</span><span class="la-data">'+a.wt+' · '+a.rep+'</span></div>';
    });
    h+='</div>';
  }
  h+='<div style="font-size:.65em;color:var(--d);padding:4px 16px">→ 下次训练：'+L.summary.next+'</div>';
  h+='</div></div>';
  if(adj){h+='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">⚠️</span>针对本次训练的调整（下次生效）<span class="arrow">▼</span></div><div class="layer-b">';
    adj.notes.forEach(function(n){
      const parts=n.split('|');
      if(parts.length>=3){
        h+='<div style="white-space:nowrap;padding:3px 0;font-size:.73rem">';
        h+='<span style="font-weight:700;color:var(--t)">'+parts[0]+'</span>';
        for(let i=1;i<parts.length;i++){
          h+=' <span class="ex-tag">'+parts[i]+'</span>';
        }
        h+='</div>';
      }else{
        h+='<div style="padding:2px 0;white-space:nowrap;font-size:.7rem">'+n+'</div>';
      }
    });
    h+='</div></div>';}
  h+=teaSection(L.planType,dsKey);
  h+=recSection(L.planType);
  h+=nutSection(ptype);
  h+=ovFooter();
  h+='</div>';
  renderMain(h);
}

// ── SECTIONS ──
function teaSection(ptype,dsKey){
  const t=TEA[ptype];if(!t)return'';
  const tl=TCM_LOG[dsKey];
  let h='<div class="layer"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">🍵</span>茶饮调理<span class="arrow">▼</span></div><div class="layer-b">';
  h+='<div class="tea-base">'+t.f+'</div>';
  if(tl)h+='<div class="tea-adj">⚡ 今日调整：'+tl.tea_extra+'</div>';
  h+='<div class="tea-special">'+t.s+'</div>';
  t.n.forEach(n=>h+='<div class="tea-note">⭐ '+n+'</div>');
  h+='</div></div>';
  h+='<div class="layer collapsed"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">🔄</span>通用加减（根据当日身体信号选择）<span class="arrow">▼</span></div><div class="layer-b">';
  U.forEach(u=>h+='<div class="tea-note" style="padding:2px 0">'+u+'</div>');
  h+='</div></div>';
  return h;
}

function recSection(ptype){
  const r=REC[ptype];if(!r||!r.length)return'';
  let h='<div class="layer collapsed"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">🧘</span>训练后恢复<span class="arrow">▼</span></div><div class="layer-b">';
  r.forEach(x=>h+='<div class="rec-item"><span class="rec-act">'+x.r+'</span><span class="rec-dur">'+x.d+'</span></div>');
  h+='</div></div>';
  return h;
}

function nutSection(ptype){
  const nt=nutType(ptype);const n=NUT[nt];if(!n)return'';
  let h='<div class="layer collapsed"><div class="layer-h" onclick="toggleLayer(this)"><span class="icon">🍽️</span>餐食搭配 · '+n.name+' · '+n.kcal+'kcal · P'+n.p+' C'+n.c+' F'+n.f+'<span class="arrow">▼</span></div><div class="layer-b">';
  n.meals.forEach((m,i)=>{
    h+='<div class="meal-row"><div class="meal-name">'+(i+1)+'. '+m.meal+' <span style="font-weight:400;color:var(--gl)">'+m.kcal+'kcal P'+m.P+' C'+m.C+' F'+m.F+'</span></div>';
    h+='<div class="meal-items">'+m.items+'</div></div>';
  });
  h+='</div></div>';
  return h;
}

// ── HELPERS ──
function ovHeader(dsKey,title,sub){
  return '<div class="ov-header"><div><div class="title">'+title+'</div><div class="sub">'+dsKey+(sub?' · '+sub:'')+'</div></div><button class="close-btn" onclick="closeView()">✕</button></div>';
}
function ovFooter(){return '<div style="padding:10px 16px;text-align:center"><button class="btn-sm" onclick="closeView()">关闭 · 返回日历</button></div>';}
function toggleLayer(el){el.closest('.layer').classList.toggle('collapsed')}
function renderMain(h){
  document.getElementById('mainContent').innerHTML=h;
}
function closeView(){
  document.getElementById('mainContent').innerHTML='<div class="empty">👆 点击日历上的日期查看训练计划或记录</div>';
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderCalendar();
</script>
