<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.5,user-scalable=yes"><title>训练中枢</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#060608"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<style>:root{--bg:#060608;--c1:#0c0d10;--c2:#111318;--b:#1c1d24;--t:#c8c8cc;--d:#5a5a60;--gl:#c89640;--rd:#e05040;--gn:#50a060;--bl:#5090c0;--cy:#40b8b0;--pp:#9060b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);padding:6px;max-width:900px;margin:0 auto}
.h{background:linear-gradient(135deg,#0a0c14,#060810);padding:14px 10px;border-radius:12px;margin-bottom:8px;text-align:center;border:1px solid #1a1c28;position:relative}
.h::after{content:'';position:absolute;top:0;left:10%;width:80%;height:1px;background:linear-gradient(90deg,transparent,rgba(80,144,176,.2),transparent)}
.h h1{font-size:1.05em;color:#fff;letter-spacing:2px;font-weight:300}.h .sub{font-size:0.58em;color:var(--d);margin-top:2px;letter-spacing:1px}
.nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.nav button{background:var(--c1);border:1px solid var(--b);color:var(--t);padding:5px 12px;border-radius:5px;font-size:0.7em;cursor:pointer}
.nav button:active{background:var(--c2)}.nav .mon{color:#fff;font-size:0.85em;font-weight:600;min-width:90px;text-align:center}
.legend{display:flex;gap:10px;justify-content:center;margin-bottom:6px;font-size:0.55em;color:var(--d);flex-wrap:wrap}
.legend .dot{width:6px;height:6px;border-radius:3px;display:inline-block;margin-right:3px;vertical-align:middle}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;background:var(--c1);border-radius:10px;overflow:hidden;border:1px solid var(--b)}
.cal .dow{background:var(--c2);color:var(--d);text-align:center;padding:7px 2px;font-size:0.62em;font-weight:600;letter-spacing:1px}
.cell{background:var(--c1);aspect-ratio:1.05;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3px 2px;cursor:default;position:relative;border:1.5px solid transparent;min-width:0}
.cell .n{font-size:0.7em;color:var(--d);line-height:1;margin-bottom:1px}
.cell.today{border-color:var(--cy);border-radius:5px;z-index:1}
.cell.has-log{cursor:pointer}.cell.has-log:active{background:var(--c2)}
.cell .tag{font-size:0.48em;padding:1px 3px;border-radius:2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;margin-top:1px}
.cell .dot-log{width:5px;height:5px;border-radius:3px;background:var(--gn);position:absolute;top:3px;right:3px}
.tg-t1{background:#142810;color:#60a040}.tg-l1{background:#0c1428;color:#5088c0}.tg-t2{background:#281410;color:#c07040}.tg-l2{background:#0c1c1c;color:#40a8a0}.tg-r{background:#141420;color:#8060a0}.tg-o{background:#1a1808;color:#a09040}.tg-x{color:#333}
.ov{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:100;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov.open{display:block}
.ov-c{background:var(--c1);margin:16px auto 60px;max-width:720px;border-radius:12px;border:1px solid var(--b);overflow:hidden}
.ov-h{background:var(--c2);padding:10px 12px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:10}
.ov-h .t{color:#fff;font-weight:600;font-size:0.85em}.ov-h .s{font-size:0.62em;color:var(--d)}.ov-h .close{background:none;border:none;color:var(--d);font-size:1.4em;cursor:pointer;padding:2px 6px;line-height:1}
.layer-t{background:var(--c2);padding:7px 12px;font-size:0.68em;font-weight:700;letter-spacing:1px;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:6px}
.l1 .layer-t{color:var(--bl)}.l2 .layer-t{color:var(--gn)}.l3 .layer-t{color:var(--rd)}.l4 .layer-t{color:var(--pp)}.l5 .layer-t{color:var(--gl)}.l6 .layer-t{color:var(--cy)}
.layer-t{cursor:pointer;user-select:none}
.layer.collapsed>:not(.layer-t){display:none}.layer:not(.collapsed)>.ex-r-detail{display:block}
.layer.collapsed .layer-t::after{content:' ▸'}
.layer .layer-t::after{content:' ▾';font-size:0.7em;opacity:.4;margin-left:auto}
.ex-r{padding:6px 10px;border-bottom:1px solid #1a1a1a;font-size:0.68em;cursor:pointer;user-select:none}
.ex-r:active{background:var(--c2)}
.ex-r-sum{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ex-r-sum .n{color:var(--d);min-width:14px;font-size:0.85em}.ex-r-sum .nm{font-weight:600;color:#e0e0e0;min-width:85px;font-size:0.9em}
.ex-r-sum .mus{font-size:0.65em;color:var(--gl);background:#1a1208;padding:1px 4px;border-radius:2px;white-space:nowrap}
.ex-r-sum .m{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:wrap}
.ex-r-sum .m .wt{color:var(--gl);font-weight:700;font-size:0.9em}.ex-r-sum .m .sr{font-size:0.78em;color:var(--t)}.ex-r-sum .m .rir{font-size:0.68em;color:var(--bl);margin-left:2px}.ex-r-sum .m .rest{font-size:0.65em;color:var(--d);margin-left:4px}
.ex-r-detail{display:none;padding:8px 10px 10px;line-height:1.5}
.ex-r.open .ex-r-detail{display:block}
.phase{margin:6px 0 0 0;background:#151518;border-radius:6px;padding:7px 9px}
.phase-t{color:var(--gn);font-weight:700;font-size:0.88em;margin-bottom:4px}
.phase ol{margin:0 0 0 16px;font-size:0.92em;color:#b0b0b8}.phase li{margin:3px 0;line-height:1.45}
.phase li strong{color:#e0e0e0}
.bre{color:var(--bl);font-size:0.85em;margin:5px 0 0 6px}.bre::before{content:"🫁  "}
.mm{color:var(--gl);font-size:0.85em;margin:5px 0 0 6px;line-height:1.4}.mm::before{content:"💡 "}
.wt-r{font-size:0.85em;color:var(--gl);margin:5px 0 0 6px}.wt-r::before{content:"⚖️  "}
.err-sm{background:#141010;border-left:2px solid var(--rd);border-radius:5px;padding:7px 9px;margin:6px 0 0 0;font-size:0.9em}
.err-sm .t{color:var(--rd);font-weight:700;margin-bottom:4px}.err-sm .t::before{content:"✗ "}
.err-sm li{font-size:0.9em;color:#c07070;margin:2px 0;list-style:none;line-height:1.4}
.err-sm li::before{content:"• ";color:var(--rd)}
.alt-sm{background:#101810;border-left:2px solid var(--gl);border-radius:5px;padding:7px 9px;margin:6px 0 0 0;font-size:0.9em;color:#a0b090}
.alt-sm .t{color:var(--gl);font-weight:700;margin-bottom:3px}.alt-sm .t::before{content:"🔄  "}
.bar-mini{width:40px;height:3px;background:#1a1a1a;border-radius:1px;overflow:hidden}.bar-mini .in{height:100%;border-radius:1px}
.in-g{background:var(--gn)}.in-y{background:var(--gl)}.in-r{background:var(--rd)}.in-b{background:var(--bl)}
.tag-sm{font-size:0.58em;padding:1px 4px;border-radius:2px;display:inline-block}.fl-g{background:#142814;color:var(--gn)}.fl-r{background:#281414;color:var(--rd)}.fl-y{background:#281c10;color:var(--gl)}
.fd{background:#0c0d12;border-left:3px solid var(--bl);border-radius:5px;padding:7px 9px;margin-bottom:5px;font-size:0.68em}
.fd .t{color:var(--bl);font-weight:700;margin-bottom:2px}.fd .t::before{content:"🔍 "}.fd p{color:#a0a0a8;margin:2px 0;line-height:1.5}.fd .fix{color:var(--gn);margin-top:2px}.fd .fix::before{content:"→ "}
.alert-sm{background:#181010;border:1px solid #301818;border-radius:5px;padding:7px 9px;margin:6px 0;font-size:0.68em}
.alert-sm .h{color:var(--rd);font-weight:700;display:block;margin-bottom:2px}.alert-sm .h::before{content:"⚡ "}.alert-sm p{color:#b08080;margin:2px 0}
.adj{background:#101810;border-left:3px solid var(--gn);border-radius:5px;padding:7px 9px;margin:6px 0;font-size:0.68em}
.adj .t{color:var(--gn);font-weight:700;margin-bottom:3px}.adj .t::before{content:"📌 "}.adj li{color:#90a090;margin:1px 0 1px 8px}
.rec-item{padding:5px 8px;font-size:0.66em;color:#b0b0b0;border-bottom:1px solid #1a1a1a;line-height:1.4}
.rec-item .r{color:var(--pp);font-weight:600}
.tea-item{padding:5px 8px;font-size:0.66em;color:#b0b0b0;border-bottom:1px solid #1a1a1a;line-height:1.4}
.tea-item .r{color:var(--gl);font-weight:600}
.tea-formula{font-size:0.72em;color:var(--gl);padding:8px 10px;line-height:1.6;word-break:break-all}
.tea-special{font-size:0.66em;color:#a0b090;padding:4px 10px}
.tea-note{font-size:0.62em;color:var(--d);padding:2px 10px 2px 16px}
.tea-note::before{content:"⚠️ "}
.btn-row{text-align:center;padding:10px}
.btn-close{background:var(--c2);border:1px solid var(--b);color:var(--t);padding:8px 32px;border-radius:6px;font-size:0.75em;cursor:pointer}
.btn-close:active{background:#222}
.ft{text-align:center;color:var(--d);font-size:0.52em;padding:14px 0;letter-spacing:1px;line-height:1.8}
@media(min-width:500px){.cell .n{font-size:0.8em}.cell .tag{font-size:0.54em}.ex-r{font-size:0.72em}}
.meas-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:550px){.meas-grid{grid-template-columns:repeat(2,1fr)}}
.meas-ratio{text-align:center;padding:8px;border-radius:8px;background:var(--c2)}
.meas-ratio .v{font-size:1.8em;font-weight:700}.meas-ratio .l{font-size:0.6em;color:var(--d)}
.meas-hist{overflow-x:auto}.meas-hist td,.meas-hist th{padding:4px 7px;white-space:nowrap;text-align:center}
.meas-hist th{color:var(--d);font-size:0.65em;font-weight:600}
.meas-hist td{font-size:0.68em;border-bottom:1px solid #16161a}
</style></head><body>

<div class="wt-r">首周30kg。宽距=偏外背阔肌下部+上背宽度。和周二窄距（中背厚度）形成完整互补。</div><div class="phase"><div class="phase-t">1 设置</div><ol><li>胸<strong>贴实</strong>在垫子上（不是虚浮，压实）。双脚踏实脚台</li><li>手<strong>宽握</strong>（正握，握距约为肩宽的1.5-2倍）。肘在身体两侧较外侧</li><li>手臂自然下垂。肩胛骨微前伸——背阔肌被动拉长。下巴微收</li></ol></div><div class="phase"><div class="phase-t">2 上拉 · 向心（1-2秒）</div><ol><li><strong>第一步：肩胛骨后收</strong>——先夹肩胛骨。和所有划船一样的铁律</li><li>第二步：肘向外、向后上方拉，把手到<strong>下胸位</strong>。宽握版本画的是外扩的弧线</li><li>顶峰：外背阔肌下部收紧。肩胛骨完全收紧——感受上背的宽度方向发力</li></ol></div><div class="phase"><div class="phase-t">3 下放 · 离心（2-3秒）</div><ol><li>有控制送回去——肩胛骨前伸——背阔肌被动拉长</li><li>手下放到底但不完全放松——始终保持背部张力。不停留，下一组</li></ol></div><div class="bre">上拉时呼，下放时吸</div><div class="mm">宽握画外扩弧线。和周二窄距形成完整覆盖——窄=中背厚度，宽=上背宽度和背阔肌下部。两天的T杆是两个不同的动作。</div><div class="err-sm"><div class="t">常见错误</div><li>胸离垫子=借了身体后仰的力=中背刺激打折+脊柱负荷。胸必须贴实</li><li>握距不够宽=和窄距没有区别=两天的互补性丢失。必须1.5-2倍肩宽</li><li>耸肩到顶峰=斜方肌上束抢活=背阔肌下部刺激被分走</li></div><div class="alt-sm"><div class="t">可替换</div>杠铃俯身划船宽握（自由重量版本）/ 宽握坐姿绳索划船 / 直臂下拉（替代角度，偏下沿）</div>
`;

case'窄距对握坐姿绳索划船':return`
<div class="wt-r">首周40kg。V把窄握。脊柱有靠垫=McGill安全方案——腰方肌不代偿。</div><div class="phase"><div class="phase-t">1 设置</div><ol><li>窄握V把。双脚踏实前方踏板，膝盖微屈。臀后坐，背<strong>贴紧靠垫</strong></li><li>手臂完全伸直——肩胛骨前伸——中下背肌群被动拉长</li><li>胸椎微伸展——挺胸但不弓腰。核心收紧。头部正中——不低头不抬头</li></ol></div><div class="phase"><div class="phase-t">2 拉 · 向心（1-2秒）</div><ol><li><strong>第一步：肩胛骨后收</strong>——先夹肩胛骨。这是所有划船的灵魂</li><li>第二步：屈肘后拉，V把拉到<strong>腹部</strong>位置（不是胸口！胸口=中上背接管）</li><li>顶峰：肩胛骨完全收紧——中下斜方和菱形肌用力挤压。保持半秒</li></ol></div><div class="phase"><div class="phase-t">3 回放 · 离心（2-3秒）</div><ol><li>有控制让手臂回到伸直——肩胛骨前伸——背阔肌被动拉长</li><li>整个过程身体不后仰——靠垫的作用就是防止你借体重。不停留，下一组</li></ol></div><div class="bre">拉时呼，回时吸</div><div class="mm">先动肩胛骨，再动肘。背比手臂先工作——这是所有划船的灵魂。拉到腹部不是胸口。</div><div class="err-sm"><div class="t">常见错误</div><li>身体后仰太多=用体重+腰部借力=背没刺激+腰受累。背贴紧靠垫，靠垫就是防止这个的</li><li>手先拉，肩胛骨没夹=背的刺激减半。先夹肩胛骨再动手臂——这个顺序是铁律</li><li>拉到胸口而不是腹部=中上背被激活=中下背的孤立刺激打折。V把的目标是腹部</li></div><div class="alt-sm"><div class="t">可替换</div>单臂哑铃划船（单侧独立，纠正左右不平衡）/ 胸部支撑哑铃划船（脊柱零负荷，更安全版本）/ 杠铃俯身划船反握（自由重量版本）</div>
`;

case'直臂绳索下拉':return`
<div class="wt-r">滑轮最高，装直杆。首周20kg。轻重量=控制为王。</div><div class="phase"><div class="phase-t">1 设置</div><ol><li>滑轮调至<strong>最高</strong>（超过头顶）。正握直杆（或绳索把手）。后退一步</li><li>手臂在身体前方与肩平或稍高。手臂<strong>微屈5-10度</strong>——肘角全程固定不变</li><li>身体微前倾（约10-15度），核心收紧。脚一前一后或与肩同宽</li></ol></div><div class="phase"><div class="phase-t">2 下拉 · 向心（1-2秒）</div><ol><li>手臂伸直保持（肘角不变），从头顶高度下拉到大腿前方。只有<strong>肩关节</strong>在动——手臂是一根直棍</li><li>下拉到大腿前时，肩胛骨微微后收。顶峰：背阔肌下沿用力收紧</li></ol></div><div class="phase"><div class="phase-t">3 回放 · 离心（2-3秒）</div><ol><li>有控制让手臂回到头顶高度——背阔肌下沿被拉长。这是下沿生长的关键阶段</li><li><strong>手臂始终微屈，肘角不变</strong>。不停留，触即拉下一组</li></ol></div><div class="bre">下拉时呼，回放时吸</div><div class="mm">手臂是一根直棍——只有肩关节在动。肘弯了=变成划船=下沿刺激归零。全程感受背阔肌最下沿的收缩和拉伸。</div><div class="err-sm"><div class="t">常见错误</div><li>手臂弯曲=下拉变成划船动作=背阔肌下沿孤立刺激归零。保持5-10度微屈固定</li><li>重量太大=用身体后仰借力=下沿孤立效果消失。降重，控制为王</li><li>手臂完全伸直锁死=肘关节承受全部张力=肘不适。保持微屈</li></div><div class="alt-sm"><div class="t">可替换</div>哑铃仰卧直臂上拉/Pullover（背阔肌极致拉伸，杠铃或哑铃版本）/ 直臂杠铃下拉 / 高位绳索下拉（滑轮最高位版本）</div>
`;

case'锤式弯举':return`
<div class="wt-r">8kg起。能标准3x12则10kg。掌心相对全程不变。和周二哑铃弯举（旋后）分别训练二头的不同功能。</div><div class="phase"><div class="phase-t">1 设置 · 站姿与握法</div><ol><li>站直，双脚与髋同宽。双手各持哑铃，手臂自然下垂在身体两侧</li><li>掌心<strong>相对</strong>（中立位）——这是锤式的标志。全程掌心相对不变，不旋转手腕</li><li>大臂<strong>贴紧身体两侧</strong>，全程不动。肘关节在身体侧面——不是体前</li><li>核心微收——身体不后仰。肩胛骨微微后收</li></ol></div><div class="phase"><div class="phase-t">2 弯举 · 向心阶段（1-2秒）</div><ol><li>向上弯举——<strong>掌心相对全程不变</strong>，不旋转手腕。这是锤式和哑铃弯举的唯一区别</li><li>大臂完全固定——只有前臂在动。顶峰：肱肌（位于二头下方）和二头短头用力收紧</li><li>锤式主要刺激<strong>肱肌</strong>——练肱肌是为了让手臂从正面看更厚，从侧面看更有立体感</li></ol></div><div class="phase"><div class="phase-t">3 下放 · 离心阶段（3秒）</div><ol><li><strong>3秒</strong>有控制下放——离心阶段是肌肥大的关键，尤其是对肱肌这种小肌群</li><li>手肘<strong>不完全锁死</strong>——保持肱肌和二头持续紧张。锁肘=卸载=刺激中断</li><li>哑铃回到起始位后不停留——直接下一组</li></ol></div><div class="bre">弯举时呼，下放时吸</div><div class="mm">锤式=像在锤钉子——掌心相对不转腕。肱肌在二头下方——练它是为了让手臂从正面看厚度增加，从侧面看线条更立体。</div><div class="err-sm"><div class="t">常见错误</div><li>身体后仰借力=重量太重了。自然训练者的弯举不需要大重量——8-10kg足够</li><li>大臂向前移动=三角肌前束抢活=二头肌刺激打折。大臂必须始终贴紧身体</li><li>下放太快（不到1秒）=离心刺激丢失=肌肥大信号打折。强制3秒下放</li></div><div class="alt-sm"><div class="t">可替换</div>反握杠铃弯举（肱肌+肱桡肌）/ 绳索锤式弯举（龙门架恒定张力，更好的离心控制）/ 哑铃Zottman弯举（旋上+旋下，全角度刺激）</div>
`;

case'死虫式':return`
<div class="wt-r">首周自重。下次可手持1-2kg哑铃+脚踝夹轻哑铃。<strong>不练腹直肌=不增腰围。</strong></div><div class="phase"><div class="phase-t">1 设置 · 身体位置</div><ol><li>仰卧。手臂<strong>伸直指向天花板</strong>。腿抬起至<strong>桌面位</strong>（髋90度+膝90度）</li><li><strong>下背平贴地面</strong>——这是最关键的一步。手掌塞进腰下，刚好能塞进去=正确。腰弓起来=核心松了=动作作废</li><li>收紧核心——想象肚脐往脊柱方向拉。整个腹部像一个压紧的弹簧</li><li>自然呼吸，不憋气。这是稳定性训练，不是力量训练</li></ol></div><div class="phase"><div class="phase-t">2 动作 · 抗旋转（3秒下放，2秒回）</div><ol><li><strong>对侧手脚</strong>同时缓慢下放（右手+左脚同时，或左手+右脚同时）</li><li>手臂过头（不触地），腿伸直（脚离地<strong>约5cm不触地</strong>）——悬空是关键</li><li>保持2秒在最远端，然后有控制回到起始。换对侧。全程<strong>下背不能离开地面</strong>——一旦腰弓起来就停</li><li>每一次只动一只手和一只脚——身体其余部位像石头一样不动。这才是抗旋转</li></ol></div><div class="bre">自然呼吸，下放时吸，回时呼。不憋气</div><div class="mm">身体像装了水的杯子——水（腹部）不能晃出来。慢，控制，稳。</div><div class="err-sm"><div class="t">常见错误</div><li>下背弓离地面=核心没在工作=腰椎在代偿=腰会痛。手掌塞腰下自检</li><li>太快（不到2秒）=惯性代替了抗旋转=核心刺激归零。这个是稳定性训练不是速度训练</li><li>憋气=腹压靠憋气而非核心肌肉维持=白练。自然呼吸</li><li>脚触地=失去底部悬空的核心挑战=动作作废</li></div><div class="alt-sm"><div class="t">可替换</div>鸟狗式/Bird Dog（更基础，四足跪姿版本）/ 帕洛夫推/Pallof Press（龙门架抗旋转黄金动作，能加重）/ 平板支撑（等长核心，不练抗旋转）</div>
`;

function recDetail(name){switch(name){
case'慢走冷身':return'<div class="phase"><div class="phase-t">执行</div><ol><li>训练结束后不要立刻坐下或躺下——在健身房或户外<strong>慢走2分钟</strong></li><li>心率从120+bpm逐渐降到80-90bpm。目的是帮助血液将肌肉中的代谢废物（乳酸等）运走</li><li>走的时候自然摆臂，深呼吸——不是玩手机。这2分钟直接影响第二天的酸痛程度</li></ol></div><div class="mm">慢走冷身是最被低估的恢复手段。零成本，2分钟，比任何补剂都有效。</div>';
case'泡沫轴·股四头肌':return'<div class="phase"><div class="phase-t">① 准备</div><ol><li>俯卧，泡沫轴横放在<strong>大腿前侧</strong>（髋到膝之间）</li><li>双肘撑地，身体重量压在泡沫轴上</li></ol></div><div class="phase"><div class="phase-t">② 滚动</div><ol><li>身体前后<strong>缓慢</strong>滚动——从髋部下方到膝盖上方。速度：约5-10cm/秒</li><li>遇到<strong>酸痛点</strong>（感觉像有个疙瘩或特别紧的地方）→<strong>停30秒</strong>，保持压力，不要加压力</li><li>每侧2分钟。不要太重——不是越痛越好</li></ol></div><div class="mm">泡沫轴不是越痛越好。酸痛点停30秒等它慢慢松开——不要用力碾压。</div><div class="err-sm"><div class="t">常见错误</div><li>滚太快=筋膜没时间松开=白做</li><li>压到膝盖或髋骨=关节损伤</li></ul></div>';
case'泡沫轴·胸椎':return'<div class="phase"><div class="phase-t">① 准备</div><ol><li>仰卧，泡沫轴<strong>横放在上背部</strong>（肩胛骨下方，胸椎段）</li><li>双手抱头，肘朝前。臀着地，膝弯曲，脚踩地</li></ol></div><div class="phase"><div class="phase-t">② 滚动</div><ol><li>臀微抬起，身体在泡沫轴上<strong>缓慢上下滚动</strong>——范围仅限于<strong>肩胛骨到胸腰交界</strong></li><li><strong>绝对不滚到腰椎</strong>（肋骨以下）——腰椎没有肋骨保护，直接滚=伤肾</li><li>每上下一轮约5秒。做1分钟</li></ol></div><div class="mm">只滚胸椎段（有肋骨保护）。腰椎绝对不滚——那是McGill的脊柱安全铁律。</div><div class="err-sm"><div class="t">常见错误</div><li>滚到腰椎=肾脏和脊柱直接受压=危险。只在肋骨区域滚动</li><li>头后仰=颈椎受压=下巴保持微收</li></ul></div>';
case'弹力带外旋·肘贴身体':return'<div class="phase"><div class="phase-t">① 设置</div><ol><li>将弹力带固定在<strong>腰部高度</strong>的固定物上（或另一只手拉住）</li><li>大臂<strong>贴紧身体侧面</strong>——肘弯90°——前臂朝前。手抓弹力带</li></ol></div><div class="phase"><div class="phase-t">② 执行</div><ol><li>大臂不动——只有<strong>前臂向外旋转</strong>（手从身体前方→旋转到身体外侧）</li><li>旋转到最大幅度→顶峰收紧肩袖→2秒控制回。15次/侧</li><li>这个动作训练的是<strong>冈下肌+小圆肌</strong>——你左肩最需要的保护</li></ol></div><div class="mm">大臂像被胶水粘在身体上——只有前臂在转。不是拉，是旋转。</div>';
case'泡沫轴·腘绳肌':return'<div class="phase"><div class="phase-t">① 准备</div><ol><li>坐地，泡沫轴横放在<strong>大腿后侧</strong></li><li>双手撑地，臀抬离地面，身体重量压在泡沫轴上</li></ol></div><div class="phase"><div class="phase-t">② 滚动</div><ol><li>身体前后缓慢滚动——范围从<strong>坐骨下方到膝后上方</strong></li><li><strong>绝对不滚到膝后腘窝</strong>——那里有神经血管，直接压=麻</li><li>酸痛点停30秒。每侧2分钟</li></ol></div><div class="mm">腘绳肌是RDL后的紧张大户。腘窝（膝后）不滚——那是雷区。</div>';
case'悬挂肩拉伸':return'<div class="phase"><div class="phase-t">执行</div><ol><li>双手抓引体杆，握距与肩同宽。身体<strong>完全悬挂</strong>——脚离地</li><li>完全放松——让肩胛骨充分上提——肩关节囊被"拉开"</li><li>保持30秒×2组。引体+划船后肩关节囊被压缩→这个悬挂让它恢复空间</li></ol></div><div class="mm">全身放松——不要用力拉。让重力帮你拉开肩关节。</div>';
case'弹力带拉开(pull-apart)':return'<div class="phase"><div class="phase-t">① 设置</div><ol><li>双手持弹力带，手臂<strong>伸直</strong>在胸前，与地面平行</li><li>掌心朝下或朝上——朝下=更多中下斜方，朝上=更多后束</li></ol></div><div class="phase"><div class="phase-t">② 执行</div><ol><li>手臂保持伸直→双手向<strong>两侧拉开</strong>弹力带→肩胛骨用力<strong>向后夹</strong></li><li>拉到弹力带触到胸前或下巴。顶峰肩胛完全收紧→2秒控制回。20次</li><li>这是中下斜方肌和后束的王牌激活动作</li></ol></div><div class="mm">手臂是两根直棍——只有肩胛骨在动。想象肩胛骨中间夹一支笔。</div>';
case'筋膜球·胸肌':return'<div class="phase"><div class="phase-t">① 准备</div><ol><li>面对墙站立。将筋膜球（或网球）放在<strong>胸大肌和肩膀前侧之间</strong></li><li>身体向前压——用体重让球压入胸肌</li></ol></div><div class="phase"><div class="phase-t">② 执行</div><ol><li>找到胸肌里<strong>紧的"条索"</strong>（感觉像一根绷紧的弦）→停<strong>30-45秒</strong>，不加重力</li><li>慢慢抬手过头+放下（增加胸肌的滑动范围）。每侧1.5分钟</li><li>球比泡沫轴更精准——能直接命中胸肌和前三角肌之间的紧张点</li></ol></div><div class="mm">找那条<strong>绷紧的弦</strong>——停在上面等它松开。球比泡沫轴精准10倍。</div>';
case'弹力带外旋·90°外展位':return'<div class="phase"><div class="phase-t">① 设置</div><ol><li>将弹力带固定在<strong>肩部高度</strong></li><li>大臂<strong>抬起90°</strong>（与肩平）——肘弯90°——前臂朝下</li><li>手抓弹力带。这是你<strong>肩外旋活动度受限的角度</strong></li></ol></div><div class="phase"><div class="phase-t">② 执行</div><ol><li>大臂固定不动——只有<strong>前臂向上旋转</strong>（掌心从朝下→旋转到朝前/朝上）</li><li><strong>小幅度开始</strong>——不追求全幅度。以<strong>不产生疼痛</strong>为底线</li><li>转到你当下的最大角度（可能比正常人少20-30°——正常！）→2秒控制回。15次/侧</li><li>这个动作<strong>趁热做</strong>——训练后肩关节囊最松弛，是改善活动度的黄金窗口</li></ol></div><div class="mm">你受限的角度！小幅度、不痛、趁热做。现在转不到90°没关系——每周多1°就是进步。千万不要为了追求幅度而产生疼痛。</div>';
case'侧卧胸椎旋转':return'<div class="phase"><div class="phase-t">① 设置</div><ol><li>侧卧，双腿弯曲叠放。双手伸直在胸前合拢</li></ol></div><div class="phase"><div class="phase-t">② 执行</div><ol><li>上侧手从胸前<strong>划弧打开</strong>到身后——<strong>眼睛跟着手走</strong></li><li>关键是：只有<strong>胸椎</strong>在旋转——<strong>腰椎不动</strong>，髋不翻</li><li>转到胸椎的最大幅度→停2秒→回。10次/侧</li><li>推日后胸椎僵硬→影响第二天拉日的肩胛活动。这个动作打开胸椎→引体会更顺</li></ol></div><div class="mm">眼睛跟着手——这是让胸椎旋转的诀窍。腰和髋不动——只有上半身转。</div>';
case'髋屈肌拉伸':return'<div class="phase"><div class="phase-t">① 设置</div><ol><li>单膝跪地——后膝着地，前膝90°。双手放在前膝上</li><li>骨盆<strong>不前倾不后倾</strong>——保持中立</li></ol></div><div class="phase"><div class="phase-t">② 执行</div><ol><li>臀<strong>向前推</strong>——感受后腿<strong>大腿根部前侧</strong>（髋屈肌）的拉伸</li><li>拉伸到有牵拉感但不疼。保持<strong>30秒</strong>，深呼吸</li><li>每侧1分钟。一周4天训练→髋屈肌累积缩短→深蹲时腰容易代偿</li></ol></div><div class="mm">骨盆保持中立——不前倾不后倾。拉伸的是大腿根前侧，不是腰。</div>';
case'低强度有氧':return'<div class="phase"><div class="phase-t">执行</div><ol><li>慢跑/骑车/快走——<strong>心率60-70%最大心率</strong></li><li>25-30分钟。标准：可以边做边正常说话（不喘）</li><li>目的是促进血液循环加速恢复——不是消耗热量。不要做成HIIT</li></ol></div><div class="mm">可以边做边聊天的强度。目的是恢复，不是减脂——心率不要太高。</div>';
case'泡沫轴:上背+肩胛+臀':return'<div class="phase"><div class="phase-t">上背+肩胛（同胸椎泡沫轴）</div><ol><li>仰卧，泡沫轴横放上背——范围限于肩胛骨到胸腰交界——绝对不滚腰椎</li></ol></div><div class="phase"><div class="phase-t">臀部</div><ol><li>坐泡沫轴上，一侧脚踝搭对侧膝上——臀在泡沫轴上前后滚动。酸痛点停30秒</li></ol></div><div class="mm">上背只滚胸椎段。臀部分开滚——每侧重点不同。</div>';
case'真空吸腹':return'<div class="phase"><div class="phase-t">执行（晨起空腹·排泄后·吃饭前）</div><ol><li>站直，双脚与髋同宽。双手放髋骨上感受腹横肌。</li><li><strong>彻底呼气</strong>——肺里所有气呼干净。这是最关键的一步。</li><li>呼完后把<strong>肚脐向脊柱方向吸进去</strong>——想象肚脐要碰到后背。不是收腹（绷腹直肌），是<strong>真空吸</strong>。</li><li>保持<strong>15-20秒</strong>。小口浅呼吸，但腹部保持吸入状态。</li><li>放松，正常呼吸30秒。重复<strong>3-5组</strong>。</li></ol></div><div class="mm">不是"收腹"——收腹是绷紧腹直肌练六块。真空吸腹是训练腹横肌（最深层的腹部肌肉），像一条天然腰带，收紧后腰围视觉上小一圈。Arnold和Frank Zane每天做。</div><div class="err-sm"><div class="t">常见错误</div><li>肺里还有气就开始吸=腹横肌没被完全激活=白做。先呼干净。</li><li>收腹（绷腹直肌）而不是吸腹（向内拉）——两个不同动作。</li><li>耸肩或弓腰=代偿。站姿保持中立。</li></div>';
default:return'';}}

  fields.forEach(function(f){var v=parseFloat(document.getElementById('meas_'+f).value);if(isNaN(v)){alert('请填写全部数据再保存');return}entry[f]=v});
  if(Object.keys(entry).length<9)return;
  var data=[];try{data=JSON.parse(localStorage.getItem('body_meas')||'[]');}catch(e){}
  var found=false;for(var i=0;i<data.length;i++){if(data[i].date===ds){data[i]=entry;found=true;break}}
  if(!found)data.push(entry);
  data.sort(function(a,b){return a.date.localeCompare(b.date)});
  localStorage.setItem('body_meas',JSON.stringify(data));
  showMeasure();
}
function showMeasure(){
  var h='<div class="ov-h"><span class="t">📐 身体围度追踪</span><span class="s">肩·胸·腰·臂·腿 · 每月量一次 · 皮尺+镜子</span><button class="close" onclick="closeOv()">✕</button></div>';
  var data=[];try{data=JSON.parse(localStorage.getItem('body_meas')||'[]');}catch(e){}
  h+='<div style="padding:10px 12px"><div class="meas-grid">';
  h+=measInput('肩围','shoulder','绕三角肌最宽处·背靠墙','cm');
  h+=measInput('胸围','chest','绕乳头·正常呼吸','cm');
  h+=measInput('腰围','waist','绕肚脐·不收腹','cm');
  h+=measInput('臂围 L','armL','屈臂收紧·二头肌峰','cm');
  h+=measInput('臂围 R','armR','同上','cm');
  h+=measInput('腿围 L','legL','站直·大腿中段','cm');
  h+=measInput('腿围 R','legR','同上','cm');
  h+=measInput('体重','weight','晨起·排泄后·空腹','kg');
  h+='</div>';
  var lastW='';if(data.length)lastW=data[data.length-1].weight;
  h+='<div style="text-align:center;padding:12px 0 6px"><button onclick="saveMeasure()" style="background:var(--cy);color:#000;border:none;padding:9px 40px;border-radius:6px;font-size:0.85em;font-weight:700;cursor:pointer">保存 · 记录今天</button></div></div>';
  setTimeout(function(){
    var fields=['shoulder','chest','waist','armL','armR','legR','legL','weight'];
    fields.forEach(function(f){var el=document.getElementById('meas_'+f);if(el&&!el.value&&f==='weight'&&lastW)el.value=lastW});
  },50);
  if(data.length){
    h+='<div style="padding:8px 12px"><div style="font-size:0.72em;color:var(--gl);margin-bottom:8px;font-weight:600">📊 历史记录</div>';
    var last=data[data.length-1];
    var sw=(last.shoulder/last.waist).toFixed(2);var cw=(last.chest/last.waist).toFixed(2);
    var sc=sw>=1.4?'var(--gn)':'var(--gl)';var sl=sw>=1.4?'王嘉尔区':'进行中';
    var cc=cw>=1.25?'var(--gn)':'var(--gl)';var cl=cw>=1.25?'彭于晏区':'进行中';
    h+='<div style="display:flex;gap:8px;margin-bottom:10px">';
    h+='<div class="meas-ratio" style="flex:1"><div class="v" style="color:'+sc+'">'+sw+'</div><div class="l">肩腰比 '+sl+'</div></div>';
    h+='<div class="meas-ratio" style="flex:1"><div class="v" style="color:'+cc+'">'+cw+'</div><div class="l">胸腰比 '+cl+'</div></div>';
    h+='</div><div class="meas-hist"><table style="width:100%;border-collapse:collapse"><tr><th>日期</th><th>肩</th><th>胸</th><th>腰</th><th>臂L</th><th>臂R</th><th>腿L</th><th>腿R</th><th>体重</th><th>肩腰比</th><th>胸腰比</th></tr>';
    data.slice().reverse().forEach(function(r){
      var sr=(r.shoulder/r.waist).toFixed(2);var cr=(r.chest/r.waist).toFixed(2);
      var src=sr>=1.4?'var(--gn)':'var(--gl)';var crc=cr>=1.25?'var(--gn)':'var(--gl)';
      h+='<tr><td style="color:var(--d)">'+r.date+'</td>';
      h+='<td style="color:#e0e0e0">'+r.shoulder+'</td><td>'+r.chest+'</td><td>'+r.waist+'</td><td>'+r.armL+'</td><td>'+r.armR+'</td><td>'+r.legL+'</td><td>'+r.legR+'</td>';
      h+='<td style="color:var(--cy)">'+r.weight+'</td>';
      h+='<td style="color:'+src+'">'+sr+'</td>';
      h+='<td style="color:'+crc+'">'+cr+'</td></tr>';
    });
    h+='</table></div></div>';
  }else{h+='<div style="text-align:center;padding:16px;color:var(--d);font-size:0.72em">还没有记录 · 用皮尺量一次录入第一组数据</div>'}
  h+='<div class="btn-row"><button class="btn-close" onclick="closeOv()">关闭 · 返回日历</button></div>';
  document.getElementById('ovc').innerHTML=h;document.getElementById('ov').classList.add('open');
}
